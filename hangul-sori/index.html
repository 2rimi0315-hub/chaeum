<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>채움 한글 소리 여행 — 한글 읽기 중재 수업자료</title>
<style>
:root{
  --bg:#f7f4ec; --card:#ffffff; --ink:#2b2b33; --muted:#7a7a85;
  --a:#e8613c; --a-soft:#fdeae3; --b:#2f7fd4; --b-soft:#e3eefc;
  --green:#3aa25f; --green-soft:#e2f3e8; --yellow:#f5b93c; --yellow-soft:#fdf3dc;
  --purple:#8b5cc9; --purple-soft:#f0e8fb; --line:#e5e0d4;
  --r:22px; --shadow:0 4px 14px rgba(60,50,30,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:17px; line-height:1.5;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
button:active{transform:scale(.97);}
.hidden{display:none!important;}

#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:rgba(247,244,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
#topbar .home-btn{font-size:22px;padding:6px 10px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);}
#crumb{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-chip{padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;background:var(--card);box-shadow:var(--shadow);}
#star-chip{background:var(--yellow-soft);border:1.5px solid var(--yellow);}
#script-toggle.on{background:var(--yellow);}
#main{max-width:1100px;margin:0 auto;padding:16px 16px 120px;}

.hero{background:linear-gradient(135deg,#31456e,#4b6ba8);color:#fff;border-radius:var(--r);
  padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}
.hero h1{margin:0 0 6px;font-size:25px;}
.hero p{margin:0;opacity:.9;font-size:14.5px;}
.hero .evidence-link{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);
  padding:7px 14px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;margin-right:8px;}
.setup{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.setup .panel{flex:1 1 280px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);}
.panel h3{margin:0 0 10px;font-size:15px;color:var(--muted);}
#student-name{width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--line);font-size:17px;font-family:inherit;}

/* 교육과정 내비게이터 */
.stage-list{display:flex;flex-direction:column;gap:10px;}
.stage-row{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid transparent;}
.stage-row.cur{border-color:var(--yellow);}
.stage-row .st-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.stage-row .st-name{font-weight:800;font-size:16px;}
.stage-row .st-type{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;}
.stage-row .st-struct{font-size:12px;color:var(--muted);margin-left:auto;font-weight:700;}
.pair-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pair-chip{padding:7px 13px;border-radius:12px;background:var(--bg);font-weight:800;font-size:16px;border:2px solid transparent;}
.pair-chip.sel{background:var(--yellow-soft);border-color:var(--yellow);}
.pair-chip.done-pair{background:var(--green-soft);}
.pair-chip.selA{background:var(--a-soft);border-color:var(--a);color:var(--a);}
.pair-chip.selB{background:var(--b-soft);border-color:var(--b);color:var(--b);}
.st-note{font-size:12.5px;color:var(--muted);margin-top:6px;}

.menu-section{margin-bottom:18px;}
.menu-section h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.menu-section h2 .tag{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:800;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.menu-card{background:var(--card);border-radius:var(--r);padding:16px 14px;box-shadow:var(--shadow);
  text-align:left;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;position:relative;}
.menu-card:hover{border-color:var(--yellow);}
.menu-card .mc-emoji{font-size:34px;}
.menu-card .mc-title{font-weight:800;font-size:17px;}
.menu-card .mc-desc{font-size:13px;color:var(--muted);line-height:1.4;}
.menu-card .done-star{position:absolute;top:10px;right:12px;font-size:20px;}

.flow-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;margin:0 0 12px;}
.flow-dot{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  font-size:15px;opacity:.4;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;}
.flow-dot.past{opacity:.85;background:var(--green-soft);}
.flow-dot.now{opacity:1;border-color:var(--yellow);transform:scale(1.18);}
.flow-line{width:8px;height:2.5px;background:var(--line);}
.flow-label{width:100%;text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px;}
.start-bar{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-align:center;margin-bottom:20px;}
.act-head{margin-bottom:14px;}
.act-head h2{margin:0;font-size:22px;display:flex;align-items:center;gap:10px;}
.act-head .goal{color:var(--muted);font-size:14px;margin-top:3px;}
.stage{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-height:300px;}
.big-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:18px;
  font-size:19px;font-weight:800;background:var(--ink);color:#fff;box-shadow:var(--shadow);}
.big-btn.soft{background:var(--bg);color:var(--ink);}
.big-btn.green{background:var(--green);}
.big-btn.blue{background:var(--b);}
.big-btn:disabled{opacity:.35;cursor:default;}
.round-info{font-size:14px;color:var(--muted);font-weight:700;}
.feedback{min-height:34px;font-size:20px;font-weight:800;text-align:center;margin-top:12px;}
.feedback.ok{color:var(--green);} .feedback.no{color:var(--a);}
.center{text-align:center;}
.progress-dots{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
.progress-dots span{width:12px;height:12px;border-radius:50%;background:var(--line);}
.progress-dots span.hit{background:var(--green);}
.progress-dots span.miss{background:var(--a);}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0;}
.mini-note{font-size:13px;color:var(--muted);margin-top:10px;}
.magnet{width:54px;height:54px;border-radius:50%;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;
  transition:transform .25s, margin .45s, opacity .3s;background:#fff;padding:3px;border:none;}
.magnet.playing{transform:scale(1.28);}
.magnet svg{width:100%;height:100%;display:block;}
.peek{filter:blur(6px);cursor:pointer;transition:filter .15s;user-select:none;font-weight:800;}
.peek.show{filter:none;}

.ph-big{font-size:64px;font-weight:900;line-height:1;}
.word-card{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);
  border:2.5px solid var(--line);border-radius:20px;padding:14px 18px;min-width:110px;box-shadow:var(--shadow);}
.word-card .wc-emoji{font-size:52px;line-height:1.1;}
.word-card .wc-label{font-size:20px;font-weight:800;}
.word-card.facedown .wc-emoji,.word-card.facedown .wc-label{visibility:hidden;}
.word-card.facedown{background:repeating-linear-gradient(45deg,#5b76a8,#5b76a8 12px,#51698f 12px,#51698f 24px);position:relative;}
.word-card.facedown::after{content:"❓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;}

.monster-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.monster{width:170px;padding:18px 10px 14px;border-radius:26px;text-align:center;border:3px solid transparent;background:var(--bg);}
.monster .m-emoji{font-size:64px;}
.monster .m-ph{font-size:30px;font-weight:900;margin-top:4px;}
.monster.A{background:var(--a-soft);} .monster.A .m-ph{color:var(--a);}
.monster.B{background:var(--b-soft);} .monster.B .m-ph{color:var(--b);}
.monster.correct{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft);}
.monster.wrong{border-color:var(--a);opacity:.55;}

.sort-cols{display:flex;gap:14px;margin-top:14px;}
.sort-col{flex:1;background:var(--bg);border-radius:18px;padding:12px;min-height:180px;border:2.5px dashed var(--line);}
.sort-col h4{margin:0 0 8px;text-align:center;font-size:26px;font-weight:900;}
.sort-col .col-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.col-chip{font-size:26px;background:var(--card);border-radius:12px;padding:4px 8px;box-shadow:var(--shadow);}

.frog-stage{display:flex;flex-direction:column;align-items:center;gap:10px;}
.frog-display{font-size:40px;transition:font-size .4s;}
.judge-row{display:flex;gap:16px;justify-content:center;margin-top:8px;}
.judge-btn{padding:14px 22px;border-radius:18px;font-size:19px;font-weight:800;box-shadow:var(--shadow);}
.judge-btn.same{background:var(--green-soft);border:2.5px solid var(--green);}
.judge-btn.diff{background:var(--yellow-soft);border:2.5px solid var(--yellow);}

.elk-boxes{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap;}
.elk-box{width:80px;height:80px;border:3px solid var(--ink);border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:32px;font-weight:900;background:#fff;}
.elk-box .chip{width:42px;height:42px;border-radius:50%;background:var(--yellow);box-shadow:var(--shadow);}
.elk-box.revealed{background:var(--green-soft);border-color:var(--green);}
.pos-tabs{display:flex;gap:8px;justify-content:center;margin:6px 0;}
.pos-tab{padding:8px 16px;border-radius:12px;background:var(--bg);font-weight:800;border:2px solid transparent;}
.pos-tab.sel{background:var(--purple-soft);border-color:var(--purple);color:var(--purple);}

.trace-wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;}
.trace-box{position:relative;width:280px;height:280px;background:#fff;border:3px solid var(--line);border-radius:20px;overflow:hidden;}
.trace-box svg{position:absolute;inset:0;}
.trace-box canvas{position:absolute;inset:0;touch-action:none;}
.stroke-guide path{fill:none;stroke:#d8d3c6;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;}
.stroke-anim path{fill:none;stroke:var(--a);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;}
.stroke-dot path{fill:none;stroke:#c3ad91;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 13;}
.trace-unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.trace-cap{font-weight:900;font-size:16px;padding:4px 14px;border-radius:999px}
.trace-tools{display:flex;flex-direction:column;gap:10px;}
.mouth-hint{background:var(--purple-soft);border-radius:16px;padding:12px 16px;font-size:16px;max-width:300px;}
.mouth-hint b{color:var(--purple);}

.build-area{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.syll-slot{width:150px;height:150px;border:3px dashed var(--line);border-radius:20px;display:flex;
  align-items:center;justify-content:center;font-size:80px;font-weight:900;background:#fff;}
.syll-slot.done{border-style:solid;border-color:var(--green);background:var(--green-soft);}
.letter-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px;}
.tray-label{width:100%;text-align:center;font-size:13px;font-weight:800;color:var(--muted);}
.letter-card{width:70px;height:70px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--line);}
.letter-card.consonant{border-color:#c9d8ee;} .letter-card.vowel{border-color:#f3cfc2;}
.letter-card.jongc{border-color:#cfe8d6;}
.letter-card.sel{border-color:var(--ink);background:var(--yellow-soft);}

.write-cols{display:flex;gap:12px;margin-top:12px;}
.write-col-btn{flex:1;padding:16px;border-radius:18px;font-size:34px;font-weight:900;background:var(--bg);border:3px solid var(--line);}
.write-col-btn.sel{border-color:var(--ink);background:var(--yellow-soft);}
.write-canvas-wrap{position:relative;margin-top:14px;background:#fff;border:3px solid var(--line);border-radius:20px;overflow:hidden;}
.write-canvas-wrap canvas{display:block;width:100%;height:260px;touch-action:none;}
.canvas-guideline{position:absolute;left:0;right:0;top:50%;border-top:2px dashed #eee;pointer-events:none;}
.written-list{display:flex;gap:14px;margin-top:14px;}
.written-list .wl-col{flex:1;background:var(--bg);border-radius:14px;padding:10px;}
.wl-col h5{margin:0 0 6px;text-align:center;font-size:20px;}
.wl-col .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.wl-chip{background:var(--card);padding:4px 12px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);}
.wl-chip.wrong{background:var(--a-soft);color:var(--a);}

.bingo-grid{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center;margin:16px auto;}
.bingo-cell{width:90px;height:90px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);position:relative;}
.bingo-cell.marked{background:var(--green-soft);border-color:var(--green);}
.bingo-cell.marked .mark-emoji{position:absolute;font-size:24px;right:4px;bottom:2px;}
.bingo-cell.lined{background:var(--yellow-soft);border-color:var(--yellow);}
.bingo-side{display:flex;flex-direction:column;align-items:center;gap:10px;}

.flu-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px;}
@media(max-width:700px){.flu-grid{grid-template-columns:repeat(3,1fr);}}
.rec-row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
.rec-row audio{height:38px;max-width:230px;}
.flu-word{padding:14px 4px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  font-size:24px;font-weight:800;text-align:center;border:2.5px solid var(--line);}
.flu-word.err{background:var(--a-soft);border-color:var(--a);color:var(--a);text-decoration:line-through;}
.flu-word.nonword{border-style:dashed;}
.timer-display{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;}
.trial-chart{display:flex;gap:20px;align-items:flex-end;justify-content:center;height:150px;margin-top:16px;}
.trial-bar{width:70px;border-radius:10px 10px 0 0;background:var(--b);position:relative;
  display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:800;padding-top:4px;}
.trial-bar .tb-label{position:absolute;bottom:-24px;color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap;}

.sentence-box{font-size:30px;line-height:2;text-align:center;margin:18px 0;}
.tok{display:inline-block;padding:2px 10px;margin:2px;border-radius:12px;border:2.5px solid transparent;}
.tok.sel{border-color:var(--ink);background:var(--yellow-soft);}
.tok.hit{background:var(--green-soft);border-color:var(--green);}
.tok.miss{border-color:var(--a);border-style:dashed;}
.tok.wrongpick{background:var(--a-soft);border-color:var(--a);}
.para-box{font-size:26px;line-height:2.1;background:var(--bg);border-radius:18px;padding:18px 20px;margin:14px 0;text-align:left;}
.para-box .brk{color:var(--a);font-weight:900;margin:0 2px;}

.eval-table{width:100%;border-collapse:collapse;margin:14px 0;}
.eval-table th,.eval-table td{padding:10px 8px;border-bottom:1.5px solid var(--line);text-align:center;font-size:15px;}
.eval-table th{color:var(--muted);font-size:13px;}
.eval-100{color:var(--green);font-weight:900;}
.eval-low{color:var(--a);font-weight:900;}
.crit-banner{border-radius:16px;padding:14px 18px;font-weight:800;text-align:center;margin:12px 0;}
.crit-banner.pass{background:var(--green-soft);color:var(--green);}
.crit-banner.stay{background:var(--yellow-soft);color:#9a7415;}

#script-drawer{position:fixed;top:0;right:-420px;width:min(400px,92vw);height:100vh;background:#fffdf6;
  box-shadow:-6px 0 24px rgba(0,0,0,.15);z-index:100;transition:right .25s;display:flex;flex-direction:column;}
#script-drawer.open{right:0;}
#script-drawer .sd-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
#script-drawer .sd-head b{flex:1;}
#script-body{flex:1;overflow-y:auto;padding:14px 16px 40px;font-size:15px;}
.sd-step{margin-bottom:16px;}
.sd-step h4{margin:0 0 6px;font-size:14px;display:inline-block;padding:3px 10px;border-radius:999px;}
.sd-step.m h4{background:var(--a-soft);color:var(--a);}
.sd-step.gp h4{background:var(--b-soft);color:var(--b);}
.sd-step.ip h4{background:var(--green-soft);color:var(--green);}
.sd-step.rv h4{background:var(--purple-soft);color:var(--purple);}
.sd-step p{margin:4px 0;white-space:pre-line;}
.sd-tip{background:var(--yellow-soft);border-radius:12px;padding:8px 12px;font-size:13.5px;margin-top:6px;}
.sd-ev{font-size:12.5px;color:var(--muted);margin-top:6px;}

.modal-back{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:24px;max-width:660px;width:100%;max-height:82vh;overflow-y:auto;padding:24px;}
.modal h3{margin-top:0;}
.modal .close-x{float:right;font-size:22px;}
.ev-item{margin-bottom:12px;font-size:14.5px;}
.ev-item b{display:block;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
.confetti span{position:absolute;font-size:28px;animation:fall 1.8s ease-in forwards;}
@keyframes fall{from{transform:translateY(-40px) rotate(0);}to{transform:translateY(105vh) rotate(340deg);opacity:.6;}}
.hw-sheet{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:26px 30px;color:#111;}
.hw-sheet h4{margin:18px 0 8px;font-size:16px;border-left:5px solid #6FA893;padding-left:8px;}
.hw-trace{color:#c8c8c8;font-weight:800;}
.hw-cells{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0;}
.hw-cell{border:1.5px solid #ccc;border-radius:8px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:36px;}
.hw-wline{border-bottom:1.8px solid #bbb;min-height:42px;font-size:26px;letter-spacing:6px;padding:4px 2px;}
@media print{
  body *{visibility:hidden!important;}
  #hw-sheet, #hw-sheet *{visibility:visible!important;}
  #hw-sheet{position:absolute;left:0;top:0;width:100%;border:none;border-radius:0;}
}
@media(max-width:600px){
  .ph-big{font-size:48px;}
  .bingo-grid{grid-template-columns:repeat(3,76px);}
  .bingo-cell{width:76px;height:76px;font-size:32px;}
  .sentence-box{font-size:24px;}
}
</style>
</head>
<body>
<div id="topbar">
  <button class="home-btn" onclick="goHome()">🏠</button>
  <div id="crumb">한글 소리 여행</div>
  <button class="top-chip" id="star-chip">⭐ 0</button>
  <button class="top-chip" id="set-indicator" onclick="goHome()"></button>
  <button class="top-chip" id="script-toggle" onclick="toggleScript()">📖 스크립트</button>
</div>
<div id="main"></div>
<footer id="site-footer" style="text-align:center;padding:34px 12px 40px">
  <div id="footer-logo" style="display:flex;justify-content:center"></div>
  <div style="margin-top:12px;font-size:12.5px;line-height:1.7;color:var(--muted);font-weight:700">
    ⓒ <span id="copy-year"></span> 채움언어학습연구소. All rights reserved.<br>
    본 자료의 무단 복제·배포·수정을 금합니다.
  </div>
</footer>
<div id="script-drawer">
  <div class="sd-head"><b id="sd-title">교사 스크립트</b>
  <button onclick="toggleScript()" style="font-size:20px">✕</button></div>
  <div id="script-body"></div>
</div>
<div id="modal-root"></div>
<div id="confetti-root"></div>

/* ---------- 한글 조합/분해 ---------- */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function decompose(ch){
  const c=ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return null;
  return {cho:CHO[Math.floor(c/588)], jung:JUNG[Math.floor((c%588)/28)], jong:JONG[c%28]};
}
function compose(cho,jung,jong){
  return String.fromCharCode(0xAC00+(CHO.indexOf(cho)*21+JUNG.indexOf(jung))*28+(jong?JONG.indexOf(jong):0));
}

/* ---------- 전역 상태 ---------- */
const state={stageIdx:0, pairIdx:0, name:'', stars:0, session:{}, fluTrials:[], done:{}, donePairs:{}, currentAct:'home', cur:null,

}

  if(state.custom){ const i=CURRICULUM.findIndex(s=>s.name===(state.custom.group||'')); return i<0? state.stageIdx : i; }
  return state.stageIdx;
}
function groupPhonemes(si){
  const seen=[];
  CURRICULUM[si].pairs.flat().forEach(ph=>{ if(!seen.includes(ph)) seen.push(ph); });

}

}
function mouthImgTag(ph,h){

/* 위치별 음소 포함 판정 */
function hasPh(word, ph, type){
  type=type||stg().type;
  for(const ch of word){
    const d=decompose(ch); if(!d) continue;
    if(type==='jung'&&d.jung===ph) return true;
    if(type==='cho'&&d.cho===ph) return true;
    if(type==='jong'&&d.jong===ph) return true;
  }
  return false;
}
function targetOf(word){
  if(hasPh(word,phA())) return 'A';
  if(hasPh(word,phB())) return 'B';
  return null;
}

/* ---------- 현재 음소쌍 데이터 빌드 ---------- */
const BASIC_CHO=['ㄴ','ㅁ','ㅅ','ㄱ','ㄷ','ㅂ'];
const BASIC_VOW=['ㅏ','ㅗ','ㅜ','ㅣ'];
function firstSylWith(word, ph){
  for(const ch of word){
    const d=decompose(ch); if(!d) continue;
    if(stg().type==='jung'&&d.jung===ph) return compose(d.cho,d.jung);
    if(stg().type==='cho'&&d.cho===ph) return compose(d.cho,d.jung);
    if(stg().type==='jong'&&d.jong===ph) return ch;
  }
  return null;
}
function buildSyllables(ph, words){
  const out=[];
  words.forEach(w=>{ const s=firstSylWith(w.w,ph); if(s&&!out.includes(s)) out.push(s); });
  // 부족하면 일반 조합으로 보충
  let i=0;
  while(out.length<4&&i<12){
    let s;
    if(stg().type==='jung') s=compose(['ㅇ','ㄴ','ㅁ','ㅅ','ㄷ','ㅂ'][i%6], ph);
    else if(stg().type==='cho') s=compose(ph, BASIC_VOW[i%4]);
    else s=compose(BASIC_CHO[i%6], BASIC_VOW[Math.floor(i/2)%4], ph);
    if(!out.includes(s)) out.push(s);
    i++;
  }
  return out.slice(0,6);
}
function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
/* ---------- 고정 난수 (음소쌍마다 늘 같은 무의미 낱말·문단 → 미리 만든 음성 파일과 1:1 대응) ---------- */
function seededRng(seedStr){
  let h=2166136261>>>0;
  for(let i=0;i<seedStr.length;i++){ h^=seedStr.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  let a=h||1;
  const random=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  return {
    random,
    rnd:(arr)=>arr[Math.floor(random()*arr.length)],
    shuffle:(arr)=>{ const b=arr.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; },
  };
}
function pairSeed(tag){ const [A,B]=stg().pairs[state.custom?0:state.pairIdx]; return stg().type+'|'+A+'|'+B+'|'+(tag||''); }
function buildNonwords(A,B){
  const R=seededRng(pairSeed('non')); const rnd=R.rnd;
  const out=new Set(); let guard=0;
  const lex=new Set([...state.cur.A.words,...state.cur.B.words].map(w=>w.w));
  const adv=stg().type==='cho'&&stageIdxOf()>=3; // 거센·된소리 단계부터 무의미 낱말에도 기본 종성
  const SON=['ㄴ','ㄹ','ㅁ','ㅇ'], FIN=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅇ'];
  while(out.size<6&&guard++<80){
    let s1,s2;
    if(stg().type==='jung'){ s1=compose(rnd(BASIC_CHO),A); s2=compose(rnd(BASIC_CHO),B); }
    else if(stg().type==='cho'){ s1=compose(A,rnd(BASIC_VOW)); s2=compose(B,rnd(BASIC_VOW)); }
    else { s1=compose(rnd(BASIC_CHO),rnd(BASIC_VOW),A); s2=compose(rnd(BASIC_CHO),rnd(BASIC_VOW),B); }
    let w=R.random()<0.5? s1+s2 : s2+s1;
    if(adv){
      const ch=[...w];
      // 마지막 음절 종성 (어말 위치 — 대표음 그대로 읽히는 기본 종성만)
      if(R.random()<0.6){ const d=decompose(ch[1]); ch[1]=compose(d.cho,d.jung,rnd(FIN)); }
      // 첫 음절엔 공명 종성만 — 뒤 초성이 ㅎ이면 격음화가 생기므로 제외
      const d2=decompose(ch[1]);
      if(R.random()<0.4&&d2.cho!=='ㅎ'){ const d=decompose(ch[0]); ch[0]=compose(d.cho,d.jung,rnd(SON)); }
      w=ch.join('');
    }
    if(!lex.has(w)) out.add(w);
  }
  return [...out];
}
function josa(word, withJong, noJong){
  const d=decompose(word.charAt(word.length-1));
  return (d&&d.jong)? withJong : noJong;
}
/* 긴 글 읽기 문단 길이 — 근거 기반 어절 목표
   · 반복읽기 지문은 50~200 낱말, 능력이 낮을수록 짧게 (Shanahan; NRP 2000)
   · 1분 문단읽기 규준: 1학년 60·2학년 70어절 (난독증 진단·지도 가이드북); H&T 2017 1학년 가을 50%ile 29 WCPM
   → 해독 단계 아동은 1학년 이전 수준이므로 규준보다 짧게, 1분 내 읽을 분량으로 단계별 확장 */
function paraTargetEojeol(){
  const i=stageIdxOf();
  if(i<2) return 12;   // 도입(기본 모음·초성): 첫 연결 읽기 — 아주 짧은 글
  if(i<5) return 26;   // 기본 종성~된소리: 짧은 문단 (1학년 규준 60어절의 약 절반)
  return 40;           // ㅑ·ㅘ계열: 문단 (1학년 1분 규준 60어절 이내)
}
function buildSentences(){
  const R=seededRng(pairSeed('sent'));
  const aw=R.shuffle(state.cur.A.words.map(w=>w.w)), bw=R.shuffle(state.cur.B.words.map(w=>w.w));
  let ai=0, bi=0; const na=()=>aw[ai++%aw.length], nb=()=>bw[bi++%bw.length];
  const frames=[
    ()=>{const w=na(); return `${w}${josa(w,'이','가')} 있어요`;},
    ()=>{const w=nb(); return `${w}${josa(w,'을','를')} 보아요`;},
    ()=>{const a=na(),b=nb(); return `${a}하고 ${b}${josa(b,'이','가')} 만나요`;},
    ()=>{const w=nb(); return `${w}${josa(w,'이','가')} 나와요`;},
    ()=>{const w=na(); return `${w}도 있어요`;},
    ()=>{const w=nb(); return `${w}${josa(w,'을','를')} 또 보아요`;},
    ()=>{const a=na(),b=nb(); return `${a}${josa(a,'과','와')} ${b}${josa(b,'이','가')} 만나요`;},
    ()=>`우리 모두 함께 보아요`,
  ];
  const target=paraTargetEojeol();
  const sents=[]; let eoj=0, fi=0, guard=0;
  while(eoj<target && guard++<50){
    const s=frames[fi%frames.length](); fi++;
    sents.push(s); eoj+=s.split(' ').length;
  }
  return sents.map(s=>({toks: s.split(' ').map(t=>[t, targetOf(t)])}));
}
function buildPair(){
  const [A,B]=stg().pairs[state.custom?0:state.pairIdx];
  const poolA=(POOLS[stg().type][A]||[]).filter(w=>!hasPh(w[0],B));
  const poolB=(POOLS[stg().type][B]||[]).filter(w=>!hasPh(w[0],A));
  state.cur={
    A:{ph:A, words:poolA.map(w=>({w:w[0],e:w[1]}))},
    B:{ph:B, words:poolB.map(w=>({w:w[0],e:w[1]}))},
  };
  state.cur.syllA=buildSyllables(A, state.cur.A.words);
  state.cur.syllB=buildSyllables(B, state.cur.B.words);
  state.cur.nonwords=buildNonwords(A,B);
  state.cur.sentences=buildSentences();
  state.session={}; state.fluTrials=[]; state.done={};
  updateTopbar();
  setTimeout(preloadPairAudio,0);
}
function S(){ return state.cur; }

/* ---------- 학생별 저장 (이 기기 브라우저에 보관) ---------- */
const STORE_KEY='hsy_students_v1';
let store={students:[], currentId:null};
function loadStore(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) store=JSON.parse(raw)||store; }catch(e){}
  if(!store.students) store={students:[], currentId:null};
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function curStudent(){ return store.students.find(x=>x.id===store.currentId)||null; }
function syncToStudent(){
  const st=curStudent(); if(!st) return;
  st.name=state.name; st.stars=state.stars; st.donePairs=state.donePairs;
  st.stageIdx=state.stageIdx; st.pairIdx=state.pairIdx; st.custom=state.custom;
  saveStore();
}
function loadStudent(id){
  store.currentId=id;
  const st=curStudent(); if(!st) return;
  state.name=st.name; state.stars=st.stars||0; state.donePairs=st.donePairs||{};
  state.stageIdx=Math.min(st.stageIdx||0, CURRICULUM.length-1);
  state.pairIdx=Math.min(st.pairIdx||0, CURRICULUM[state.stageIdx].pairs.length-1);
  state.custom=st.custom||null;
  buildPair(); saveStore();
}
function addStudentFromInput(){
  const inp=$('new-student'); const name=(inp&&inp.value||'').trim();
  const birth=($('new-student-birth')&&$('new-student-birth').value)||'';
  if(!name) return;
  const id='s'+Date.now()+Math.floor(Math.random()*1000);
  store.students.push({id,name,birth,stars:0,donePairs:{},stageIdx:0,pairIdx:0,records:[]});
  loadStudent(id); renderHome();
}
function removeStudent(id){
  const st=store.students.find(x=>x.id===id); if(!st) return;
  if(!confirm(st.name+' 학생과 저장된 기록을 모두 삭제할까요?')) return;
  store.students=store.students.filter(x=>x.id!==id);
  if(store.currentId===id) store.currentId=store.students.length?store.students[0].id:null;
  if(store.currentId) loadStudent(store.currentId); else { state.name=''; state.stars=0; state.donePairs={}; buildPair(); }
  saveStore(); renderHome();
}

  a.onerror=()=>{ audioCache[u]='none'; tryPlay(urls,i+1,text); };
  a.currentTime=0; currentAudio=a;
  a.play().catch(()=>{ audioCache[u]='none'; tryPlay(urls,i+1,text); });
}
/* 현재 음소쌍의 음성을 미리 받아 두기 (버튼 누르자마자 소리가 나도록) */
function preloadPairAudio(){
  if(!state.cur||soundSettings().mode==='mute') return;
  const c=state.cur, list=[];
  [c.A.ph,c.B.ph].forEach(ph=>{ list.push(sayName(ph), longName(ph)+'@slow'); });
  [...c.A.words,...c.B.words].forEach(w=>{ list.push(w.w, w.w+'@slow'); });
  [...c.syllA,...c.syllB].forEach(sy=>{ list.push(sy, sy+'@slow'); });
  c.nonwords.forEach(n=>{ list.push(n, n+'@slow'); });
  let i=0;
  (function next(){
    if(i>=list.length) return;
    const t=list[i++], slow=/@slow$/.test(t);
    const u=candidates(t.replace(/@slow$/,''), slow?0.6:1)[0];
    if(!u||audioCache[u]){ next(); return; }
    const a=new Audio(u); a.preload='auto'; audioCache[u]=a;
    a.onerror=()=>{ audioCache[u]='none'; next(); };
    a.oncanplaythrough=()=>{ a.oncanplaythrough=null; next(); };
    setTimeout(next,250);
  })();
}
function sayPh(ph){ say(sayName(ph),0.75); }
function sayPhLong(ph){ say(longName(ph),0.6); }
function saySlow(t){ say(t,0.6); }

  if(i===n-1) return '#e8613c';

}

}
function pic(w){

}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function $(id){ return document.getElementById(id); }
function confetti(){
  const root=$('confetti-root'); const box=el('<div class="confetti"></div>');
  const ems=['🎉','⭐','✨','🌟','🎈','💚'];
  for(let i=0;i<24;i++){

}

function renderScript(){
  const act=state.currentAct||'home';
  const sc=scriptFor(act);
  $('sd-title').textContent='📖 '+sc.title;
  const names={m:'모델링 (교사 시범)',gp:'함께 해보기 (안내된 연습)',ip:'스스로 해보기 (독립 연습)',rv:'리뷰'};
  let h='';
  sc.steps.forEach(([k,t,body])=>{
    h+=`<div class="sd-step ${k}"><h4>${names[k]||t}</h4><p>${body}</p></div>`;
  });
  if(sc.tips&&sc.tips.length){
    h+='<div class="sd-step"><h4 style="background:var(--yellow-soft)">💡 지도 팁</h4>';
    sc.tips.forEach(t=>h+=`<div class="sd-tip">${t}</div>`);
    h+='</div>';
  }
  if(sc.ev) h+=`<div class="sd-ev">📚 근거: ${sc.ev}</div>`;
  $('script-body').innerHTML=h;
}
function toggleScript(){
  const d=$('script-drawer');
  d.classList.toggle('open');
  $('script-toggle').classList.toggle('on', d.classList.contains('open'));
  if(d.classList.contains('open')) renderScript();
}

function todayStr(){
  const d=new Date(); const days=['일','월','화','수','목','금','토'];
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')';
}
function ageStr(birth){
  if(!birth) return '';
  const b=new Date(birth), n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate()) m--;
  if(isNaN(m)||m<0) return '';
  return '만 '+Math.floor(m/12)+'세 '+(m%12)+'개월';
}

const EVAL_LABELS={disc:'변별 (같아요 달라요)', blend:'합성 (어떤 그림일까)',
  read:'자소-음소 읽기 (읽기 척척)', dict:'듣고 쓰기 (받아쓰기)', para:'문단 (긴 글 읽기)'};
ACT_RENDER.eval=function(){
  const rows=Object.keys(EVAL_LABELS).filter(k=>state.session[k]&&state.session[k].t>0);
  let all100 = rows.length>0 && rows.every(k=>state.session[k].c===state.session[k].t);
  let tableH='';
  if(rows.length){
    tableH=`<table class="eval-table"><tr><th>과제</th><th>정반응/시도</th><th>정반응률</th></tr>`+
    rows.map(k=>{
      const s=state.session[k], pct=Math.round(s.c/s.t*100);
      return `<tr><td style="text-align:left">${EVAL_LABELS[k]}</td><td>${s.c} / ${s.t}</td>
        <td class="${pct===100?'eval-100':'eval-low'}">${pct}%</td></tr>`;
    }).join('')+'</table>';
  } else {
    tableH='<div class="mini-note center" style="margin:20px 0">아직 기록이 없어요. 활동을 진행하면 자동으로 기록됩니다.</div>';
  }
  let fluH='';
  if(state.fluTrials.length){
    fluH='<h4 style="margin:14px 0 4px">🏁 낱말 달리기 기록</h4>'+state.fluTrials.map((t,i)=>
      `<div class="mini-note">${i+1}회 — ${t.sec}초 · 오류 ${t.errs}개 · 분당 ${t.wpm}단어</div>`).join('');
  }
  const [A,B]=[phA(),phB()];
  // 다음 음소쌍 계산
  let nsi=state.stageIdx, npi=state.pairIdx+1;
  if(npi>=stg().pairs.length){ nsi++; npi=0; }
  const hasNext=!state.custom && nsi<CURRICULUM.length;
  const nextLabel=hasNext? CURRICULUM[nsi].name+' '+CURRICULUM[nsi].pairs[npi][0]+'-'+CURRICULUM[nsi].pairs[npi][1] : '전체 과정 완료!';
  const flowBar=`<div class="flow-bar">${FLOW.map((f,j)=>{
      const m=metaOf(f);
      return `<button class="flow-dot ${j<FLOW.length-1?'past':'now'}" onclick="openAct('${f}')" title="${m.title}">${state.done[f]?'⭐':m.emoji}</button>`;
    }).join('<span class="flow-line"></span>')}
    <div class="flow-label">수업 진행 ${FLOW.length} / ${FLOW.length} — 오늘 수업 끝! 🎉</div></div>`;
  $('main').innerHTML=`
    ${flowBar}
    <div class="act-head"><h2>📊 ${BRAND} 회기 기록 — ${stg().name} /${sayName(A)}/-/${sayName(B)}/</h2>
    <div class="goal">📅 ${todayStr()}${curStudent()?` · ${curStudent().name}${curStudent().birth?' ('+ageStr(curStudent().birth)+')':''}`:''} — 과제별 정반응률을 확인하고, 100% 도달 시 다음 음소쌍으로 진입해요</div></div>
    <div class="stage">
      <div class="center" style="font-size:40px">⭐ × ${state.stars}</div>
      <div class="mini-note center">이번 회기에 모은 별 — 아낌없이 칭찬해 주세요! (사회적 강화)</div>
      ${tableH}${fluH}
      <div class="crit-banner ${all100?'pass':'stay'}">
        ${all100? '💯 100% 준거 도달! 다음 음소쌍으로 진입할 수 있어요.'
                : '아직 100%가 아니에요 — 같은 음소쌍을 반복 연습하며 제시 방식을 조정해 보세요. (소리 늘여 주기 · 그림 힌트 · 구체물 병행)'}
      </div>
      <div class="pill-row">
        <button class="big-btn blue" onclick="saveSessionRecord()">💾 이 회기 기록 저장${curStudent()?' ('+curStudent().name+')':''}</button>
        ${hasNext?`<button class="big-btn green" onclick="advancePair()">➡️ 다음 음소쌍: ${nextLabel}</button>`:'<div class="big-btn green">🏆 모든 단계 완료!</div>'}
        <button class="big-btn soft" onclick="state.session={};state.fluTrials=[];openAct('eval')">🔄 기록 초기화 (같은 쌍 반복)</button>
      </div>
      ${renderHistory()}
    </div>
    <div class="center" style="margin-top:14px">
      <button class="big-btn soft" onclick="goMenu()">🗂️ 목차로</button>
      <button class="big-btn soft" onclick="goHome()">⚙️ 설정으로</button>

};
function renderHistory(){
  const st=curStudent();
  if(!st) return '<div class="mini-note center" style="margin-top:16px">홈 화면에서 학생을 등록하면 회기 기록을 저장할 수 있어요.</div>';
  const recs=st.records||[];
  let h=`<h4 style="margin:20px 0 4px">🗂 ${st.name}의 지난 회기 기록 (${recs.length}회)</h4>`;
  if(!recs.length) return h+'<div class="mini-note">저장된 기록이 없어요. 회기가 끝나면 "이 회기 기록 저장"을 눌러 주세요.</div>';
  h+='<table class="eval-table"><tr><th>날짜</th><th>단계 · 음소쌍</th><th>과제별 정반응률</th><th>준거</th><th></th></tr>';
  recs.slice().reverse().forEach((r,ri)=>{
    const realIdx=recs.length-1-ri;
    const tasks=r.tasks.map(t=>`${t.label.split(' (')[0]} ${Math.round(t.c/t.t*100)}%`).join(' · ')||'-';
    const flu=(r.flu&&r.flu.length)?` · 읽기 ${r.flu.map(f=>f.wpm).join('→')}wpm`:'';
    h+=`<tr><td>${r.date.slice(0,10)}</td><td>${r.stage} ${r.pair}</td>
      <td style="font-size:13px">${tasks}${flu}</td>
      <td class="${r.pass?'eval-100':'eval-low'}">${r.pass?'도달':'미도달'}</td>
      <td><button style="color:var(--a);font-weight:700" onclick="deleteRecord(${realIdx})">✕</button></td></tr>`;
  });
  h+='</table><div class="pill-row"><button class="big-btn soft" onclick="exportCSV()">⬇️ CSV로 내려받기 (엑셀)</button></div>';
  return h;
}
function saveSessionRecord(){
  const st=curStudent();
  if(!st){ alert('먼저 홈 화면에서 학생을 등록·선택해 주세요.'); return; }
  const rows=Object.keys(EVAL_LABELS).filter(k=>state.session[k]&&state.session[k].t>0);
  if(!rows.length&&!state.fluTrials.length){ alert('저장할 활동 기록이 아직 없어요.'); return; }
  const pass=rows.length>0&&rows.every(k=>state.session[k].c===state.session[k].t);
  st.records=st.records||[];
  st.records.push({
    date:new Date().toISOString(),
    stage:stg().name, pair:phA()+'-'+phB(),
    tasks:rows.map(k=>({label:EVAL_LABELS[k], c:state.session[k].c, t:state.session[k].t})),
    flu:state.fluTrials.slice(), stars:state.stars, pass
  });
  syncToStudent(); saveStore();
  confetti(); openAct('eval');
}
function deleteRecord(i){
  const st=curStudent(); if(!st) return;
  if(!confirm('이 회기 기록을 삭제할까요?')) return;
  st.records.splice(i,1); saveStore(); openAct('eval');
}
function exportCSV(){
  const st=curStudent(); if(!st||!(st.records||[]).length) return;
  const rows=[['날짜','학생','생년월일','단계','음소쌍','과제','정반응','시도','정반응률','준거']];
  st.records.forEach(r=>{
    r.tasks.forEach(t=>rows.push([r.date.slice(0,10),st.name,st.birth||'',r.stage,r.pair,t.label,t.c,t.t,Math.round(t.c/t.t*100)+'%',r.pass?'도달':'미도달']));
    (r.flu||[]).forEach((f,i)=>rows.push([r.date.slice(0,10),st.name,st.birth||'',r.stage,r.pair,'낱말 달리기 '+(f.label||'')+' '+(i+1)+'회',f.wpm+'wpm',f.sec+'초','오류 '+f.errs+'개','']));
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>String(c).replace(/,/g,' ')).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=st.name+'_회기기록.csv'; a.click();
}
function advancePair(){
  if(state.custom) return;
  state.donePairs[state.stageIdx+'-'+state.pairIdx]=true;
  let nsi=state.stageIdx, npi=state.pairIdx+1;
  if(npi>=CURRICULUM[nsi].pairs.length){ nsi++; npi=0; }
  if(nsi>=CURRICULUM.length){ confetti(); goHome(); return; }
  state.stageIdx=nsi; state.pairIdx=npi;
  buildPair(); syncToStudent(); confetti(); goHome();
}

<script>
/* ========== 글자 만나기 + 따라쓰기 (목표 낱자 2개: 형태 유지 + 점선 따라쓰기) ========== */
ACT_RENDER.p0b=function(){
  const A=phA(), B=phB();
  let dotFirst=false; // false면 A=형태유지, B=점선 / true면 스왑
  function unit(pos){
    // pos: 'L'(왼쪽) / 'R'(오른쪽). 왼쪽=형태 유지(안내선), 오른쪽=점선 따라쓰기
    const dotted = pos==='R';
    const capBg = dotted? 'background:var(--a-soft);color:var(--a)' : 'background:var(--b-soft);color:var(--b)';
    const cap = dotted? '✏️ 점선을 따라 써요' : '👀 이 글자예요 (형태 보기)';
    return `<div class="trace-unit">
      <div class="trace-cap" style="${capBg}" id="pb-name-${pos}"></div>
      <div class="trace-box" id="box-${pos}">
        <svg viewBox="0 0 100 100" class="${dotted?'stroke-dot':'stroke-guide'}" id="guide-${pos}"></svg>
        <svg viewBox="0 0 100 100" class="stroke-anim" id="anim-${pos}"></svg>
        <canvas id="cv-${pos}" width="280" height="280"></canvas>
      </div>
      <div class="mini-note center" style="max-width:280px">${cap}</div>
      <div style="margin:2px auto">${''}<span id="mouth-${pos}"></span></div>
      <div class="pill-row" style="gap:6px">
        <button class="pos-tab" id="say-${pos}">🔊 소리</button>
        <button class="pos-tab" id="anim-btn-${pos}">👀 획순</button>
        <button class="pos-tab" id="clr-${pos}">🧽 지우기</button>
      </div>
    </div>`;
  }
  actFrame('p0b','✏️ 글자 만나기','두 글자를 함께 봐요 — 왼쪽 글자는 눈으로 익히고, 오른쪽 점선 글자를 따라 써요 (쓰면서 소리 말하기!)',`
    <div class="center">
      <div class="pill-row"><button class="big-btn soft" id="pb-swap">↔ 두 글자 역할 바꾸기</button></div>
      <div class="trace-wrap" style="margin-top:12px">
        ${unit('L')}${unit('R')}
      </div>
      <div class="mini-note center" style="margin-top:8px">왼쪽은 완성된 글자 모양(형태 유지), 오른쪽은 점선 위를 손가락·터치펜으로 따라 쓰는 칸이에요. <b>↔ 바꾸기</b>를 누르면 두 글자의 역할이 바뀌어 둘 다 따라 쓸 수 있어요.</div>
    </div>`);
  function setup(pos){
    const canvas=$('cv-'+pos), box=$('box-'+pos);
    canvas.width=box.clientWidth; canvas.height=box.clientHeight;
    const ctx=canvas.getContext('2d');
    ctx.lineWidth=10; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#e8613c';
    let drawing=false;
    canvas.addEventListener('pointerdown',e=>{ drawing=true; const r=canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(e.clientX-r.left,e.clientY-r.top); });
    canvas.addEventListener('pointermove',e=>{ if(!drawing)return; const r=canvas.getBoundingClientRect(); ctx.lineTo(e.clientX-r.left,e.clientY-r.top); ctx.stroke(); });
    window.addEventListener('pointerup',()=>drawing=false);
    return {ctx, canvas};
  }
  const boxes={L:setup('L'), R:setup('R')};
  function phOf(pos){
    // 왼쪽=형태 유지, 오른쪽=점선. dotFirst면 A가 점선(오른쪽), B가 형태(왼쪽)
    if(!dotFirst) return pos==='L'? A : B;
    return pos==='L'? B : A;
  }
  function loadPos(pos){
    const ph=phOf(pos);
    $('pb-name-'+pos).firstChild; // no-op
    $('guide-'+pos).innerHTML=(STROKES[ph]||[]).map(d=>`<path d="${d}"/>`).join('');
    $('anim-'+pos).innerHTML='';
    $('mouth-'+pos).innerHTML=mouthImgTag(ph,84);
    boxes[pos].ctx.clearRect(0,0,boxes[pos].canvas.width,boxes[pos].canvas.height);
    const cap = pos==='R'? '✏️ 점선을 따라 써요' : '👀 이 글자예요 (형태 보기)';
    $('pb-name-'+pos).textContent=ph+' /'+sayName(ph)+'/';
  }
  function playAnim(pos){
    const ph=phOf(pos);
    const svg=$('anim-'+pos); svg.innerHTML='';
    (STROKES[ph]||[]).forEach((d,i)=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d); svg.appendChild(p);
      const len=p.getTotalLength();
      p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.style.transition='none';
      setTimeout(()=>{ p.style.transition='stroke-dashoffset .9s ease'; p.style.strokeDashoffset='0'; },300+i*1100);
    });
    setTimeout(()=>sayPh(ph),300);
    setTimeout(()=>{ svg.innerHTML=''; },300+(STROKES[ph]||[]).length*1100+1500);
  }
  ['L','R'].forEach(pos=>{
    $('say-'+pos).onclick=()=>sayPh(phOf(pos));
    $('anim-btn-'+pos).onclick=()=>playAnim(pos);
    $('clr-'+pos).onclick=()=>boxes[pos].ctx.clearRect(0,0,boxes[pos].canvas.width,boxes[pos].canvas.height);
  });
  $('pb-swap').onclick=()=>{ dotFirst=!dotFirst; loadPos('L'); loadPos('R'); };
  loadPos('L'); loadPos('R');
  sayPh(A);
};

/* ========== 8. 낱말 달리기 ========== */
ACT_RENDER.ssing=function(){
  const A=phA(), B=phB();
  const lex=new Set([...S().A.words,...S().B.words].map(w=>w.w));
  const MODES={real:'의미 낱말', mix:'랜덤'};
  function swapPh(sy){
    const d=decompose(sy); if(!d) return null;
    const t=stg().type;
    if(t==='jung'&&(d.jung===A||d.jung===B)) return compose(d.cho, d.jung===A?B:A, d.jong||null);
    if(t==='cho'&&(d.cho===A||d.cho===B)) return compose(d.cho===A?B:A, d.jung, d.jong||null);
    if(t==='jong'&&(d.jong===A||d.jong===B)) return compose(d.cho, d.jung, d.jong===A?B:A);
    return null;
  }
  function pureNonwords(n, avoid){
    const R=seededRng(pairSeed('ss-pure')); const rnd=R.rnd;
    const out=new Set(); let guard=0;
    while(out.size<n&&guard++<200){
      let s1,s2;
      if(stg().type==='jung'){ s1=compose(rnd(BASIC_CHO),A); s2=compose(rnd(BASIC_CHO),B); }
      else if(stg().type==='cho'){ s1=compose(A,rnd(BASIC_VOW)); s2=compose(B,rnd(BASIC_VOW)); }
      else { s1=compose(rnd(BASIC_CHO),rnd(BASIC_VOW),A); s2=compose(rnd(BASIC_CHO),rnd(BASIC_VOW),B); }
      const w=R.random()<0.5? s1+s2 : s2+s1;
      if(!lex.has(w)&&!(avoid&&avoid.has(w))) out.add(w);
    }
    return [...out].slice(0,n);
  }
  function neighborNonwords(n){
    const R=seededRng(pairSeed('ss-nbr')); const rnd=R.rnd;
    const out=new Set();
    const words=R.shuffle([...lex]);
    for(const w of words){
      for(let i=0;i<w.length;i++){
        if(out.size>=n) break;
        const swapped=swapPh(w[i]);
        if(!swapped) continue;
        const cand=w.slice(0,i)+swapped+w.slice(i+1);
        if(!lex.has(cand)&&cand!==w) out.add(cand);
      }
      if(out.size>=n) break;
    }
    let guard=0;
    const CH=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅈ'];
    while(out.size<n&&guard++<120){
      const w=rnd(words); const i=Math.floor(R.random()*w.length);
      const d=decompose(w[i]); if(!d) continue;
      const cand=w.slice(0,i)+compose(rnd(CH), d.jung, d.jong||null)+w.slice(i+1);
      if(!lex.has(cand)&&cand!==w) out.add(cand);
    }
    if(out.size<n) pureNonwords(n-out.size, out).forEach(x=>out.add(x));
    return [...out].slice(0,n);
  }
  let mode='real', items=[];
  function buildItems(){
    if(mode==='real') items=shuffle([...lex]).slice(0,12).map(w=>({w,kind:'real'}));
    else {
      const r=shuffle([...lex]).slice(0,6).map(w=>({w,kind:'real'}));

  }
  let running=false, startT=0, timerInt=null;

  function myTrials(){ return state.fluTrials.filter(t=>t.mode===mode); }
  async function startRec(){
    if(!recOn||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      recorder=new MediaRecorder(stream);

      recorder=null;

    if(!recorder) return;
    const r=recorder; recorder=null;
    const label=MODES[mode];
    r.onstop=()=>{
      const blob=new Blob(chunks,{type:r.mimeType||'audio/webm'});
      const url=URL.createObjectURL(blob);
      const stn=curStudent()?curStudent().name:'학생';
      recordings.push({trial:trialNo, label, url, name:stn+'_낱말달리기_'+label+'_'+trialNo+'회.webm'});

        <a class="pos-tab" href="${rc.url}" download="${rc.name}">⬇️ 저장</a>
      </div>`).join('');
  }
  actFrame('ssing','🏁 낱말 달리기','낱말을 빠르고 정확하게! 수준별로 3회씩 반복하고 기록을 비교해요',`
    <div class="center">
      <div class="pos-tabs" style="flex-wrap:wrap">
        <button class="pos-tab sel" id="fl-m-real">① 의미 낱말</button>
        <button class="pos-tab" id="fl-m-mix">② 랜덤 (의미+무의미 섞기)</button>
      </div>
      <div class="round-info" id="fl-modenote"></div>
      <div class="flu-grid" id="fl-grid"></div>
      <div style="margin-top:14px"><span class="timer-display" id="fl-timer">0.0</span>초</div>
      <div class="pill-row">
        <button class="big-btn green" id="fl-start">▶ 시작</button>
        <button class="big-btn" id="fl-stop" disabled>⏹ 끝</button>
        <button class="pos-tab sel" id="fl-rec-toggle">🎙️ 녹음 켜짐</button>
        <button class="big-btn soft" id="fl-new">🔄 새 낱말</button>
      </div>
      <div class="mini-note" id="fl-recstate"></div>
      <div class="mini-note">시작 → 학생이 소리 내 읽는 동안, 틀리게 읽은 낱말을 눌러 표시 → 끝. 녹음이 켜져 있으면 자동 녹음돼요.</div>
      <div id="fl-recs"></div>
      <div class="feedback" id="fl-fb"></div>
      <div class="trial-chart" id="fl-chart"></div>

    mix:'의미 낱말과 무의미 낱말이 랜덤으로 섞여 있어요 — 추측 없이 끝까지 정확하게 읽는 진짜 읽기 조건'};
  function renderGrid(){

    $('fl-modenote').innerHTML='💡 '+NOTES[mode];
  }
  window._flMark=function(i){

    const correct=items.length-errs.size;
    const wpm=Math.round(correct/(sec/60));
    state.fluTrials.push({mode, label:MODES[mode], sec:sec.toFixed(1), errs:errs.size, wpm});
    $('fl-start').disabled=false; $('fl-stop').disabled=true;
    fb($('fl-fb'),true,`${MODES[mode]} ${myTrials().length}회: ${sec.toFixed(1)}초, 오류 ${errs.size}개 (분당 ${wpm}단어)`);

  $('fl-errbtn').onclick=()=>{

  $('fl-rec-toggle').onclick=function(){

  function setMode(m, btn){
    if(running) return;
    mode=m; buildItems(); errs=new Set();
    ['fl-m-real','fl-m-mix'].forEach(id=>$(id).classList.remove('sel'));
    $(btn).classList.add('sel');
    $('fl-timer').textContent='0.0';
    $('fl-fb').textContent='';
    renderGrid(); renderChart();
  }
  $('fl-m-real').onclick=()=>setMode('real','fl-m-real');
  $('fl-m-mix').onclick=()=>setMode('mix','fl-m-mix');
  buildItems(); renderGrid(); renderChart();
};

<script>

/* 어떤 그림일까: 조각 소리 합성 → 그림 고르기 */
ACT_RENDER.blend=function(){
  let mode='syll';
  const bank=[...S().A.words,...S().B.words];
  let deck=[], idx=0, answered=false, opts=[];
  function units(word){
    if(mode==='syll') return word.split('');
    const u=[];
    for(const ch of word){
      const d=decompose(ch); if(!d) continue;
      if(d.cho!=='ㅇ') u.push(CHO_SAY[d.cho]||d.cho);
      u.push(VOW_SAY[d.jung]||d.jung);
      if(d.jong) u.push(JONG_SAY[d.jong]||d.jong);
    }
    return u;
  }
  function pool(){ return mode==='syll'? bank.filter(w=>w.w.length>=2) : bank.filter(w=>units(w.w).length<=4); }
  actFrame('blend','🧲 어떤 그림일까','조각난 소리를 듣고 마음속으로 합쳐서 알맞은 그림을 골라요 (합성)',`
    <div class="center">
      <div class="pos-tabs">
        <button class="pos-tab sel" id="bl-syll">음절 합치기</button>
        <button class="pos-tab" id="bl-phon">음소 합치기 (도전!)</button>
      </div>
      <div class="round-info" id="bl-round"></div>
      <div style="margin:12px 0">
        <button class="big-btn" id="bl-play">🔊 조각 소리 듣기</button>
      </div>
      <div id="bl-units" class="pill-row" style="min-height:40px"></div>
      <div class="pill-row" id="bl-opts" style="margin-top:14px"></div>
      <div class="feedback" id="bl-fb"></div>
      <button class="big-btn blue hidden" id="bl-next">다음 ▶</button>
      <div class="mini-note">🧲 자석 칩 하나 = 소리 한 조각 (🟢 처음 · 🟡 가운데 · 🔴 끝). 칩을 누르면 그 조각 소리가 나요.<br>맞히면 자석이 미끄러지며 착! 붙고 낱말 전체를 들려줍니다. 실제 자석·팝잇으로 책상 위에서 같이 해도 좋아요.</div>
    </div>`);
  function cur(){ return deck[idx]; }
  let curUnits=[];
  function renderChips(){
    curUnits=units(cur().w);
    $('bl-units').innerHTML=curUnits.map((u,i)=>
      `<button class="magnet" id="blu-${i}" style="opacity:.45" onclick="_bluTap(${i})">${magnetSVG(trafficColor(i,curUnits.length))}</button>`).join('');
  }
  window._bluTap=function(i){
    const c=$('blu-'+i); if(!c) return;
    c.style.opacity='1'; c.classList.add('playing');
    setTimeout(()=>c.classList.remove('playing'),350);
    say(curUnits[i],0.7);
  };
  function playSeq(){
    renderChips();
    let i=0;
    const t=setInterval(()=>{
      if(i>=curUnits.length){ clearInterval(t); return; }
      const c=$('blu-'+i);
      if(c){ c.style.opacity='1'; c.classList.add('playing'); setTimeout(((el)=>()=>el.classList.remove('playing'))(c),600); }
      say(curUnits[i],0.7); i++;
    },1000);
  }
  function mergeChips(){
    curUnits.forEach((u,i)=>{
      const c=$('blu-'+i); if(!c) return;
      c.style.opacity='1';
      if(i>0) c.style.marginLeft='-26px';
    });
  }
  function show(){
    answered=false;
    const P=pool(); deck=deck.length?deck:shuffle(P).slice(0,8);
    $('bl-round').textContent=(idx+1)+' / '+deck.length;
    $('bl-fb').textContent=''; $('bl-fb').className='feedback';
    $('bl-next').classList.add('hidden');
    const others=shuffle(bank.filter(w=>w.w!==cur().w)).slice(0,2);
    opts=shuffle([cur(),...others]);
    $('bl-opts').innerHTML=opts.map((o,i)=>`
      <button class="word-card" style="min-width:100px" onclick="_blPick(${i})">
        <span class="wc-emoji">${pic(o)}</span>
      </button>`).join('');
    setTimeout(playSeq,300);
  }
  window._blPick=function(i){
    if(answered) return; answered=true;
    const ok=opts[i].w===cur().w;
    track(ok);
    fb($('bl-fb'), ok, '맞아요! 자석이 착! 소리를 합쳤어요 🎉', '조각을 다시 들어 볼까요?');
    if(ok){ mergeChips(); setTimeout(()=>say(cur().w),600); }
    else { answered=false; setTimeout(playSeq,600); return; }
    if(idx<deck.length-1) $('bl-next').classList.remove('hidden'); else confetti();
  };
  $('bl-play').onclick=playSeq;
  $('bl-next').onclick=()=>{ idx++; show(); };
  $('bl-syll').onclick=function(){ mode='syll'; deck=[]; idx=0; this.classList.add('sel'); $('bl-phon').classList.remove('sel'); show(); };
  $('bl-phon').onclick=function(){ mode='phon'; deck=[]; idx=0; this.classList.add('sel'); $('bl-syll').classList.remove('sel'); show(); };
  show();
};

<script>
/* ========== 같아요 달라요 (변별) ========== */
ACT_RENDER.disc=function(){
  const A=phA(), B=phB();
  function swapT(sy){
    const d=decompose(sy); if(!d) return sy;
    const t=stg().type;
    if(t==='jung') return compose(d.cho, d.jung===A?B:A, d.jong||null);
    if(t==='cho') return compose(d.cho===A?B:A, d.jung, d.jong||null);
    return compose(d.cho, d.jung, d.jong===A?B:A);
  }
  const items=[];
  for(let i=0;i<4;i++){
    const same=i%2===0;
    const s1=i<2? sayName(A) : sayName(B);
    const s2=same? s1 : (s1===sayName(A)? sayName(B) : sayName(A));
    items.push({a:s1,b:s2,same,lv:'음소'});
  }
  const sylls=shuffle([...S().syllA,...S().syllB]).slice(0,4);
  sylls.forEach((sy,i)=>{
    const same=i%2===1;
    items.push({a:sy, b:same? sy : swapT(sy), same, lv:'음절'});
  });
  const deck=shuffle(items);
  let idx=0, answered=false;
  actFrame('disc','👂 같아요 달라요','두 소리를 잘 듣고 같은 소리인지 다른 소리인지 판단해요 (변별)',`
    <div class="center">
      <div class="round-info" id="dc-round"></div>
      <div class="progress-dots" id="dc-dots"></div>
      <div style="display:flex;gap:26px;justify-content:center;margin:18px 0">
        <button class="magnet" style="width:64px;height:64px" id="dc-s1" onclick="_dcPlay(0)">${magnetSVG('#3aa25f')}</button>
        <button class="magnet" style="width:64px;height:64px" id="dc-s2" onclick="_dcPlay(1)">${magnetSVG('#e8613c')}</button>
      </div>
      <div>
        <button class="big-btn" id="dc-play">🔊 두 소리 듣기</button>
      </div>
      <div class="judge-row" style="margin-top:14px">
        <button class="judge-btn same" id="dc-same">🟰 같아요</button>
        <button class="judge-btn diff" id="dc-diff">❌ 달라요</button>
      </div>
      <div class="feedback" id="dc-fb"></div>
      <button class="big-btn blue hidden" id="dc-next">다음 ▶</button>
      <div class="mini-note">초록 칩 = 첫 번째 소리, 빨강 칩 = 두 번째 소리. 칩을 누르면 그 소리만 다시 들을 수 있어요.</div>
    </div>`);
  const dots=$('dc-dots');
  deck.forEach(()=>dots.appendChild(el('<span></span>')));
  function cur(){ return deck[idx]; }
  window._dcPlay=function(i){
    const c=$(i===0?'dc-s1':'dc-s2');
    if(!c||!deck[idx]) return;
    c.classList.add('playing'); setTimeout(()=>{ if(c) c.classList.remove('playing'); },350);
    say(i===0? cur().a : cur().b, 0.7);
  };
  function playBoth(){
    _dcPlay(0);
    setTimeout(()=>_dcPlay(1), 1300);
  }
  function show(){
    answered=false;
    $('dc-round').textContent=(idx+1)+' / '+deck.length+' · '+cur().lv+' 수준';
    $('dc-fb').textContent=''; $('dc-fb').className='feedback';
    $('dc-next').classList.add('hidden');
    setTimeout(playBoth, 400);
  }
  function judge(sameGuess){
    if(answered) return; answered=true;
    const ok=sameGuess===cur().same;
    track(ok);
    dots.children[idx].className=ok?'hit':'miss';
    fb($('dc-fb'), ok, cur().same?'맞아요! 같은 소리예요 🎉':'맞아요! 서로 다른 소리예요 🎉',
      '다시 들어 볼까요? 선생님이 소리를 길게 늘여 들려주세요');
    if(!ok) setTimeout(playBoth, 700);
    if(idx<deck.length-1) $('dc-next').classList.remove('hidden'); else confetti();
  }
  $('dc-same').onclick=()=>judge(true);
  $('dc-diff').onclick=()=>judge(false);
  $('dc-play').onclick=playBoth;
  $('dc-next').onclick=()=>{ idx++; show(); };
  show();
};

  const N=10;
  const bank=[...S().A.words,...S().B.words];
  let pos=0, answered=false, q=null;
  function swapT(sy){
    const d=decompose(sy); if(!d) return sy;
    const t=stg().type;
    if(t==='jung') return compose(d.cho, d.jung===A?B:A, d.jong||null);
    if(t==='cho') return compose(d.cho===A?B:A, d.jung, d.jong||null);
    return compose(d.cho, d.jung, d.jong===A?B:A);
  }
  function makeQ(){
    const w=rnd(bank);
    const ph=hasPh(w.w,A)?A:B;   // 이 낱말에 든 목표 음소
    return {w, ph};
  }
  actFrame('land','🗺️ 소리 땅따먹기','낱말 속 목표 소리를 듣고, 그 소리를 내는 입 모양을 골라요 — 알맞게 고르면 한 칸씩 땅을 차지해요! (귀로만 들어요)',`
    <div class="center">
      <div class="round-info" id="ld-info"></div>
      <div class="land-board" id="ld-board"></div>
      <div id="ld-q" style="min-height:150px"></div>
      <div class="feedback" id="ld-fb"></div>
      <div class="mini-note">🐢 거북이가 내 말이에요. 그림 위 낱말에서 <b>목표 소리</b>가 들리면, 그 소리를 내는 <b>입 모양</b>을 눌러요. 맞으면 지나온 땅이 초록색 내 땅이 돼요! 🚩 깃발까지 ${N}칸. <br>(두 소리가 같은지 다른지 변별하는 활동은 <b>👂 같아요 달라요</b>에서 따로 해요.)</div>
    </div>`);
  function renderBoard(){
    $('ld-board').innerHTML=Array.from({length:N+1},(_,i)=>{
      const goal=i===N;
      return `<div class="land-tile ${i<pos?'claim':''} ${goal?'goal':''}">${goal?'🚩':(i<pos?'⭐':'')}${i===pos?'<span class="ld-tok">🐢</span>':''}</div>`;
    }).join('');
    $('ld-info').textContent='내 땅 '+pos+' / '+N+'칸';
  }
  function showQ(){
    answered=false; q=makeQ();
    $('ld-fb').textContent=''; $('ld-fb').className='feedback';
    const opts=shuffle([A,B]);
    $('ld-q').innerHTML=`
      <div class="word-card" style="display:inline-block;min-width:120px;margin-bottom:6px"><span class="wc-emoji" style="font-size:56px">${pic(q.w)}</span></div>
      <div style="margin:6px 0"><button class="big-btn" onclick="_ldSay()">🔊 목표 소리 듣기</button></div>
      <div class="mini-note">방금 들은 <b>소리</b>를 내는 <b>입 모양</b>을 골라요</div>
      <div class="pill-row" style="gap:22px;justify-content:center;margin-top:8px">
        ${opts.map(ph=>`<button class="word-card" style="min-width:130px;padding:12px" onclick="_ldPick('${ph}')"><div style="min-height:88px;display:flex;align-items:center;justify-content:center">${mouthImgTag(ph,88)}</div></button>`).join('')}
      </div>`;
    setTimeout(_ldSay,450);
  }
  window._ldSay=function(){ if(q) sayPh(q.ph); };
  function result(ok){
    if(answered) return;
    if(ok){
      answered=true;
      pos++; state.stars++; updateTopbar(); syncToStudent(); renderBoard();
      if(pos>=N){
        fb($('ld-fb'),true,'🚩 깃발 도착! 땅을 모두 차지했어요! 🏆');
        confetti(); markDone('land');
        $('ld-q').innerHTML=`<div style="font-size:62px;margin:12px 0">🏆</div><button class="big-btn green" onclick="openAct('land')">🔄 한 번 더 하기</button>`;
        return;
      }
      fb($('ld-fb'),true,'땅 한 칸 차지! 🟩');
      setTimeout(showQ,1000);
    } else {
      fb($('ld-fb'),false,null,'다시 한 번 들어 볼까요? 👂');
    }
  }
  window._ldPick=function(ph){ if(!q) return; result(ph===q.ph); };
  renderBoard(); showQ();
};

/* ========== 글자 놀이터 (파닉스 게임 4종) ========== */
ACT_RENDER.game=function(){
  const A=phA(), B=phB();
  const sylls=shuffle([...new Set([...S().syllA,...S().syllB])]);
  const words=[...S().A.words,...S().B.words];
  let timers=[];
  function clearTimers(){ timers.forEach(t=>clearInterval(t)); timers=[]; }
  actFrame('game','🎮 글자 놀이터','오늘 배운 글자로 신나게 놀아요 — 규칙은 하나, 글자는 꼭 소리 내어 읽기!',`
    <div class="center">
      <div class="pos-tabs" style="flex-wrap:wrap">
        <button class="pos-tab sel" id="gm-mem">🃏 메모리</button>
        <button class="pos-tab" id="gm-mole">🔨 두더지 잡기</button>
        <button class="pos-tab" id="gm-cc">🧺 빨간 망토</button>
        <button class="pos-tab" id="gm-rou">🎡 룰렛</button>
      </div>
      <div id="gm-body"></div>
    </div>`);

  /* ---- ① 메모리 ---- */
  function memGame(){
    const pick=sylls.slice(0,6);
    while(pick.length<6) pick.push(rnd(sylls));
    const cards=shuffle([...pick,...pick]).map(s=>({s,open:false,matched:false}));
    let open=[], lock=false, matched=0, moves=0;
    $('gm-body').innerHTML=`
      <div class="round-info" id="mem-info">짝 0 / 6 · 시도 0</div>
      <div class="mem-grid" id="mem-grid"></div>
      <div class="feedback" id="mem-fb"></div>
      <div class="mini-note">카드를 뒤집을 때마다 글자를 <b>소리 내어</b> 읽어요! 같은 글자 짝을 찾으면 내 것 🟢</div>`;
    function render(){
      $('mem-grid').innerHTML=cards.map((c,i)=>
        `<div class="mem-card ${c.open||c.matched?'open':''} ${c.matched?'matched':''}" onclick="_memFlip(${i})">${c.open||c.matched?c.s:'❓'}</div>`).join('');
      $('mem-info').textContent='짝 '+matched+' / 6 · 시도 '+moves;
    }
    window._memFlip=function(i){
      if(lock||cards[i].open||cards[i].matched) return;
      cards[i].open=true; say(cards[i].s,0.8); render();
      open.push(i);
      if(open.length===2){
        moves++; lock=true;
        const [a,b]=open;
        setTimeout(()=>{
          if(cards[a].s===cards[b].s){
            cards[a].matched=cards[b].matched=true; matched++;
            state.stars++; updateTopbar();
            if(matched===6){ confetti(); markDone('game'); fb($('mem-fb'),true,'모든 짝을 찾았어요! 시도 '+moves+'번 🎉'); }
          } else { cards[a].open=cards[b].open=false; }
          open=[]; lock=false; render();
        },900);
      }
    };
    render();
  }

  /* ---- ② 두더지 잡기 ---- */
  function moleGame(){
    let target=A, score=0, timeLeft=30, run=false, speed=2;
    const SPEEDS={1:{pop:1250,up:1950},2:{pop:900,up:1350},3:{pop:640,up:950}};
    $('gm-body').innerHTML=`
      <div class="round-info">「<b id="mo-target" style="color:var(--a);font-size:22px">${A}</b>」 소리가 든 글자 두더지만 잡아요!
        <button class="pos-tab" onclick="sayPh($('mo-target').textContent)">🔊 목표 소리</button></div>
      <div class="pill-row">
        <button class="pos-tab sel" id="mo-ta">목표 ${A}</button>
        <button class="pos-tab" id="mo-tb">목표 ${B}</button>
      </div>
      <div class="pill-row" style="gap:6px"><span style="font-weight:800;align-self:center;color:var(--muted)">🐢 속도 🐇</span>
        <button class="pos-tab" id="mo-sp1">1 느림</button>
        <button class="pos-tab sel" id="mo-sp2">2 보통</button>
        <button class="pos-tab" id="mo-sp3">3 빠름</button>
      </div>
      <div style="margin:8px 0"><span class="timer-display" id="mo-time">30</span>초 · 점수 <b id="mo-score" style="font-size:22px">0</b></div>
      <div class="mole-grid" id="mo-grid">${Array.from({length:9},(_,i)=>
        `<div class="mole-hole" id="mo-h${i}" onclick="_moWhack(${i})"><div class="mole"><span class="mface">${MOLE_SVG}</span><span class="msy" id="mo-s${i}"></span></div></div>`).join('')}</div>
      <div class="pill-row"><button class="big-btn green" id="mo-start">▶ 시작 (30초)</button></div>
      <div class="feedback" id="mo-fb"></div>
      <div class="mini-note">잡을 때 글자를 소리 내어 읽으면 효과 두 배! 목표가 아닌 글자를 누르면 점수가 깎여요.</div>`;
    function setTarget(t){
      target=t; $('mo-target').textContent=t;
      $('mo-ta').classList.toggle('sel',t===A); $('mo-tb').classList.toggle('sel',t===B);
    }
    $('mo-ta').onclick=()=>setTarget(A);
    $('mo-tb').onclick=()=>setTarget(B);
    function pop(){
      if(!$('mo-grid')){ clearTimers(); return; }
      const free=Array.from({length:9},(_,i)=>i).filter(i=>!$('mo-h'+i).classList.contains('up'));
      if(!free.length) return;
      const i=rnd(free);
      const isT=Math.random()<0.6;
      const sy=isT? rnd(target===A?S().syllA:S().syllB) : rnd(target===A?S().syllB:S().syllA);
      $('mo-s'+i).textContent=sy;
      const h=$('mo-h'+i);
      h.dataset.sy=sy; h.classList.remove('bonk'); h.classList.add('up');
      setTimeout(()=>{ if(h) h.classList.remove('up'); },SPEEDS[speed].up);
    }
    function setSpeed(s){ if(run) return; speed=s; ['mo-sp1','mo-sp2','mo-sp3'].forEach((id,k)=>$(id).classList.toggle('sel',k+1===s)); }
    $('mo-sp1').onclick=()=>setSpeed(1); $('mo-sp2').onclick=()=>setSpeed(2); $('mo-sp3').onclick=()=>setSpeed(3);
    window._moWhack=function(i){
      if(!run) return;
      const h=$('mo-h'+i);
      if(!h||!h.classList.contains('up')) return;
      const sy=h.dataset.sy;
      const ok=hasPh(sy,target);
      h.classList.add('bonk');
      setTimeout(()=>h.classList.remove('up'),150);
      if(ok){ score++; state.stars++; updateTopbar(); say(sy,0.8); }
      else { score=Math.max(0,score-1); fb($('mo-fb'),false,null,'앗! 「'+sy+'」에는 목표 소리가 없어요'); setTimeout(()=>{ if($('mo-fb'))$('mo-fb').textContent=''; },1200); }
      $('mo-score').textContent=score;
    };
    $('mo-start').onclick=()=>{
      if(run) return;
      clearTimers(); run=true; score=0; timeLeft=30;
      $('mo-score').textContent='0'; $('mo-time').textContent='30';
      $('mo-fb').textContent=''; $('mo-fb').className='feedback';
      timers.push(setInterval(pop,SPEEDS[speed].pop));
      timers.push(setInterval(()=>{
        if(!$('mo-time')){ clearTimers(); return; }
        timeLeft--; $('mo-time').textContent=timeLeft;
        if(timeLeft<=0){
          clearTimers(); run=false;
          for(let i=0;i<9;i++){ const h=$('mo-h'+i); if(h) h.classList.remove('up'); }
          fb($('mo-fb'),true,'끝! 점수 '+score+'점 '+(score>=10?'— 두더지 박사! 🏆':'🎉'));
          if(score>=10) confetti();
          markDone('game');
        }
      },1000));
    };
  }

  /* ---- ③ 빨간 망토 (낱말 속 목표 소리 → 입모양 고르며 집까지) ---- */
  function ccGame(){
    const N=8;
    const aw=S().A.words, bw=S().B.words;
    function freshDeck(){ return shuffle([...aw.map(w=>({wd:w,ph:A})),...bw.map(w=>({wd:w,ph:B}))]); }
    let deck=freshDeck();
    while(deck.length<N+2) deck=deck.concat(freshDeck());
    let pos=0, idx=0, answered=false, over=false;
    $('gm-body').innerHTML=`
      <div class="round-info" id="rc-info"></div>
      <div class="land-board" id="rc-path"></div>
      <div class="center" id="rc-card" style="margin:10px 0;min-height:130px"></div>
      <div class="pill-row" id="rc-bins" style="gap:20px;justify-content:center"></div>
      <div class="feedback" id="rc-fb"></div>
      <button class="big-btn soft hidden" id="rc-new" style="margin-top:8px">🔄 새 판</button>
      <div class="mini-note">🧺 빨간 망토가 집에 가요! 나온 낱말을 소리 내어 읽고, 그 안에 든 <b>목표 소리</b>의 입 모양(${A}/${B})을 누르면 한 칸 앞으로! 🏠 ${N}칸을 다 채우면 도착이에요.</div>`;
    function renderPath(){
      $('rc-path').innerHTML=Array.from({length:N+1},(_,i)=>{
        const home=i===N;
        return `<div class="land-tile ${i<pos?'claim':''} ${home?'goal':''}">${home?'🏠':(i<pos?'⭐':'')}${i===pos?'<span class="ld-tok">'+RED_HOOD+'</span>':''}</div>`;
      }).join('');
      $('rc-info').textContent='집까지 '+pos+' / '+N+'칸';
    }
    function renderBins(){
      const opts=shuffle([A,B]);
      $('rc-bins').innerHTML=opts.map(ph=>`<button class="word-card" style="min-width:130px;padding:12px" onclick="_rcPick('${ph}')">
        <div style="font-size:30px;font-weight:900;color:var(--${ph===A?'a':'b'})">${ph}</div>
        <div style="min-height:82px;display:flex;align-items:center;justify-content:center">${mouthImgTag(ph,82)}</div>
      </button>`).join('');
    }
    function showCard(){
      answered=false;
      const c2=deck[idx];
      $('rc-fb').textContent=''; $('rc-fb').className='feedback';
      $('rc-card').innerHTML=`<div style="font-size:44px;font-weight:900;letter-spacing:2px">${c2.wd.w}</div>
        <div style="font-size:44px">${pic(c2.wd)}</div>
        <button class="big-btn soft" onclick="saySlow('${c2.wd.w}')">🔊 낱말 듣기</button>`;
    }
    window._rcPick=function(ph){
      if(answered||over) return;
      const c2=deck[idx];
      if(ph===c2.ph){
        answered=true;
        pos++; state.stars++; updateTopbar(); renderPath();
        if(pos>=N){
          over=true; confetti(); markDone('game');
          fb($('rc-fb'),true,'🏠 집에 도착! 빨간 망토가 무사히 왔어요 🎉');
          $('rc-card').innerHTML='<div style="font-size:64px">🏠🎉</div>';
          $('rc-bins').innerHTML=''; $('rc-new').classList.remove('hidden');
          return;
        }
        fb($('rc-fb'),true,'딩동! 한 칸 앞으로 🔴');
        idx=(idx+1)%deck.length;
        setTimeout(showCard,850);
      } else {
        fb($('rc-fb'),false,null,'다시 들어볼까요? 낱말을 천천히 읽어봐요 👂');
        saySlow(c2.wd.w);
      }
    };
    $('rc-new').onclick=ccGame;
    renderPath(); renderBins(); showCard();
  }

  /* ---- ④ 룰렛 ---- */
  function rouGame(){
    const seg=shuffle([...sylls.slice(0,4), ...shuffle(words).slice(0,4).map(w=>w.w)]).slice(0,8);
    while(seg.length<8) seg.push(rnd(sylls));
    const COLS=['#ffe3e3','#fff3c9','#e1f5e0','#dceefb','#f3e5f5','#ffe9d6','#e0f7f4','#fde2f0'];
    let ang=0, spinning=false, landed=null;
    const wedges=seg.map((s,i)=>{
      const a0=i*45*Math.PI/180, a1=(i+1)*45*Math.PI/180, am=(i+0.5)*45;
      const x0=100*Math.cos(a0), y0=100*Math.sin(a0), x1=100*Math.cos(a1), y1=100*Math.sin(a1);
      const tx=66*Math.cos((i+0.5)*45*Math.PI/180), ty=66*Math.sin((i+0.5)*45*Math.PI/180);
      return `<path d="M0 0 L${x0.toFixed(1)} ${y0.toFixed(1)} A100 100 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${COLS[i]}" stroke="#fff" stroke-width="2"/>
        <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${s.length>2?11:15}" font-weight="900" transform="rotate(${am+90} ${tx.toFixed(1)} ${ty.toFixed(1)})">${s}</text>`;
    }).join('');
    $('gm-body').innerHTML=`
      <div class="rou-wrap"><div class="rou-ptr">🔻</div>
        <svg class="rou-wheel" id="rou-svg" viewBox="-104 -104 208 208">${wedges}<circle r="16" fill="#fff" stroke="var(--line)" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15">🎡</text></svg>
      </div>
      <div class="rou-res" id="rou-res"></div>
      <div class="pill-row">
        <button class="big-btn green" id="rou-spin">🎡 돌리기!</button>
        <button class="pos-tab" id="rou-say" style="visibility:hidden">🔊 정답 듣기</button>
      </div>
      <div class="judge-row" id="rou-judge" style="visibility:hidden">
        <button class="judge-btn same" onclick="_rouMark(true)">⭕ 읽었어요</button>
        <button class="judge-btn diff" onclick="_rouMark(false)">❌ 어려웠어요</button>
      </div>
      <div class="feedback" id="rou-fb"></div>
      <div class="mini-note">룰렛이 멈춘 칸의 글자·낱말을 <b>소리 내어</b> 읽어요. 잘 읽으면 ⭕ — 별이 쌓여요!</div>`;
    $('rou-spin').onclick=()=>{
      if(spinning) return;
      spinning=true; landed=null;
      $('rou-res').textContent=''; $('rou-fb').textContent=''; $('rou-fb').className='feedback';
      $('rou-judge').style.visibility='hidden'; $('rou-say').style.visibility='hidden';
      ang+=1440+Math.floor(Math.random()*360);
      $('rou-svg').style.transform='rotate('+ang+'deg)';
      setTimeout(()=>{
        if(!$('rou-res')) return;
        const theta=((270-ang)%360+360)%360;
        landed=seg[Math.floor(theta/45)];
        $('rou-res').textContent='👉 '+landed;
        $('rou-judge').style.visibility='visible';
        $('rou-say').style.visibility='visible';
        spinning=false;
      },4200);
    };
    $('rou-say').onclick=()=>{ if(landed) say(landed,0.8); };
    window._rouMark=function(ok){
      if(!landed) return;
      if(ok){ state.stars++; updateTopbar(); fb($('rou-fb'),true,'참 잘 읽었어요! ⭐'); markDone('game'); }
      else { fb($('rou-fb'),false,null,'정답을 듣고 두 번 따라 읽어요'); say(landed,0.7); }
      $('rou-judge').style.visibility='hidden';
    };
  }

  const TABS={ 'gm-mem':memGame, 'gm-mole':moleGame, 'gm-cc':ccGame, 'gm-rou':rouGame };
  Object.keys(TABS).forEach(id=>{
    $(id).onclick=function(){
      clearTimers();
      Object.keys(TABS).forEach(k=>$(k).classList.remove('sel'));
      this.classList.add('sel');
      TABS[id]();
    };
  });
  memGame();
};
</script>

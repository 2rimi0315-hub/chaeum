<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD95C">
<meta name="description" content="채움 AAC 도구함 — 먼저-다음 보드, 선택판, 타이머 카드, 핵심어휘 보드, 상황별 미니 보드, 어휘 선정 도우미">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>채움 AAC 도구함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: phone-width column (max 560px) centered; home = tool grid, each tool = its own view via #hash; shared card library feeds every tool. */
:root{
  --bg:#FFF7DC;--paper:#FFFFFF;--paper-2:#FFFBEE;--ink:#3E372A;--muted:#8C8270;--line:#EFE3B8;
  --sun:#FFD95C;--sun-deep:#E8B400;--sun-soft:#FFF0B8;
  --mint:#DDF3E8;--mint-deep:#3E9A73;--coral:#FFE1DE;--coral-deep:#D9534F;--sky:#E3EFFA;--sky-deep:#4A7FB5;
  --dot:rgba(232,180,0,.12);--shadow:0 6px 18px rgba(120,90,0,.10);
  /* Fitzgerald key (AAC color coding) */
  --f-people:#FFE57A;--f-verb:#B9E6B0;--f-desc:#B7D7F5;--f-noun:#FFC98A;--f-social:#FFC3D8;--f-misc:#D9CBF2;--f-neg:#FFB0A8;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#262319;--paper:#32302A;--paper-2:#2C2A22;--ink:#F3EBD3;--muted:#B5AC95;--line:#4A4532;--sun:#E6BE4A;--sun-deep:#F6D36A;--sun-soft:#4A4126;--mint:#2F4A3F;--mint-deep:#7FD3AB;--coral:#4E2F2D;--coral-deep:#FF9A94;--sky:#2E3B4A;--sky-deep:#9CC3EA;--dot:rgba(230,190,74,.12);--shadow:0 6px 18px rgba(0,0,0,.35);
    --f-people:#8F7A24;--f-verb:#3F6E3A;--f-desc:#2F5577;--f-noun:#8A5A22;--f-social:#8A4660;--f-misc:#5A4A80;--f-neg:#8A3A33;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#262319;--paper:#32302A;--paper-2:#2C2A22;--ink:#F3EBD3;--muted:#B5AC95;--line:#4A4532;--sun:#E6BE4A;--sun-deep:#F6D36A;--sun-soft:#4A4126;--mint:#2F4A3F;--mint-deep:#7FD3AB;--coral:#4E2F2D;--coral-deep:#FF9A94;--sky:#2E3B4A;--sky-deep:#9CC3EA;--dot:rgba(230,190,74,.12);--shadow:0 6px 18px rgba(0,0,0,.35);
  --f-people:#8F7A24;--f-verb:#3F6E3A;--f-desc:#2F5577;--f-noun:#8A5A22;--f-social:#8A4660;--f-misc:#5A4A80;--f-neg:#8A3A33;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;word-break:keep-all}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100%;display:flex;flex-direction:column;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:8px}
.top h1{font-size:1.3rem;line-height:1.2;flex:1;min-width:0}
.top h1 small{display:block;font-family:var(--font-body);font-size:.72rem;color:var(--muted);margin-top:-2px}
.icon-btn{min-width:40px;height:40px;padding:0 12px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem;white-space:nowrap;flex:none}
.icon-btn.on{background:var(--sun)}
.view{display:flex;flex-direction:column;gap:14px}

/* home */
.hero{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.hero .mark{width:64px;height:64px;border-radius:20px;background:var(--sun);display:grid;place-items:center;font-size:2rem;flex:none;box-shadow:0 4px 0 var(--sun-deep)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;list-style:none;margin:0;padding:0}
.tool{background:var(--paper);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;min-height:128px;border:2px solid transparent;transition:transform .12s}
.tool:active{transform:scale(.97)}
.tool .ic{font-size:1.8rem;line-height:1}
.tool b{font-family:var(--font-display);font-weight:400;font-size:1.1rem}
.tool span{font-size:.8rem;color:var(--muted);line-height:1.35}
.tool.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
.tool.wide div{display:flex;flex-direction:column;gap:2px;min-width:0}

/* generic */
.panel{background:var(--paper);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel.soft{background:var(--paper-2);box-shadow:none;border:2px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.label{font-size:.82rem;color:var(--muted)}
.chip{height:36px;padding:0 13px;border-radius:18px;background:var(--paper-2);border:1.5px solid var(--line);font-size:.9rem;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--sun);border-color:transparent;font-family:var(--font-display)}
.chip.ghost{background:transparent}
.big-btn{height:56px;border-radius:18px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);font-family:var(--font-display);font-size:1.2rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .1s,box-shadow .1s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.big-btn.mint{background:var(--mint);color:var(--mint-deep);box-shadow:0 5px 0 rgba(62,154,115,.35)}
.big-btn:disabled{opacity:.45}
.wide-btn{height:48px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem}
.wide-btn.danger{color:var(--coral-deep)}
.wide-btn.arm{background:var(--coral-deep);color:#fff}
.empty{text-align:center;color:var(--muted);font-size:.92rem;padding:22px 12px}
.empty b{display:block;font-family:var(--font-display);font-weight:400;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--paper-2);padding:10px 14px;font-size:1.05rem;width:100%}
.field input.display{font-family:var(--font-display);font-size:1.3rem}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sun-deep);outline:none}
.help-text{font-size:.85rem;color:var(--muted);background:var(--sun-soft);border-radius:14px;padding:10px 14px;margin:0}
footer{text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6;margin-top:auto;padding-top:10px}
footer b{font-family:var(--font-display);font-weight:400;color:var(--ink)}

/* cards */
.card{border-radius:16px;overflow:hidden;background:var(--sun-soft);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;font-family:var(--font-display);text-align:center;padding:8px;line-height:1.15;word-break:keep-all;position:relative;font-size:1.3rem}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);color:#3E372A;font-size:1rem;padding:5px 6px;line-height:1.2}
.card.plain{aspect-ratio:auto}
.slot{border-radius:20px;background:var(--paper);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot .card{font-size:1.6rem}
.slot.empty-slot .card{background:var(--paper-2);border:2.5px dashed var(--line);color:var(--muted);font-size:1rem;font-family:var(--font-body)}
.slot .tag{font-family:var(--font-display);font-size:1.15rem;display:flex;align-items:center;gap:6px}
.slot .tag .pill-n{width:28px;height:28px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:.95rem}
.slot .name{font-family:var(--font-display);font-size:1.35rem;text-align:center;overflow-wrap:anywhere}
.slot .acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot .pill{height:36px;padding:0 12px;border-radius:12px;background:var(--paper-2);border:1.5px solid var(--line);font-size:.88rem;display:inline-flex;align-items:center;gap:4px}
.slot .pill.done{background:var(--mint);border-color:transparent;color:var(--mint-deep);font-family:var(--font-display);font-size:1.05rem}
.slot.is-done .card::after{content:"✅";position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;background:rgba(255,255,255,.55)}
.slot.is-done .name{text-decoration:line-through;color:var(--muted)}
.slot.focus{outline:4px solid var(--sun-deep);outline-offset:2px}
.arrow{align-self:center;font-size:2rem;color:var(--sun-deep);line-height:1}

/* grid boards */
.grid{display:grid;gap:10px}
.cell{border-radius:16px;min-height:72px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-display);font-size:1.15rem;line-height:1.15;text-align:center;word-break:keep-all;border:2px solid rgba(0,0,0,.06);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .08s;position:relative;min-width:0;overflow:hidden;color:var(--ink)}
.cell:active{transform:translateY(2px);box-shadow:none}
.cell .sym{font-size:1.5rem;line-height:1}
.cell.has-img{padding:0;aspect-ratio:1/1}
.cell.has-img img{width:100%;height:100%;object-fit:cover}
.cell.has-img .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);color:#3E372A;font-size:.95rem;padding:4px}
.cell.blank{background:var(--paper-2);border:2.5px dashed var(--line);box-shadow:none;color:var(--muted);font-family:var(--font-body);font-size:.85rem}
.cell .edit-dot{position:absolute;top:4px;right:6px;font-size:.75rem;opacity:.6}
.c-people{background:var(--f-people)}.c-verb{background:var(--f-verb)}.c-desc{background:var(--f-desc)}.c-noun{background:var(--f-noun)}.c-social{background:var(--f-social)}.c-misc{background:var(--f-misc)}.c-neg{background:var(--f-neg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px}
.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}.cols-6{grid-template-columns:repeat(6,1fr)}
.cols-4 .cell,.cols-6 .cell{font-size:1rem;min-height:64px}
.cols-6 .cell{font-size:.85rem;min-height:56px;padding:4px;border-radius:12px}
.cols-6 .cell .sym{font-size:1.1rem}

/* sentence strip */
.strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;gap:8px;align-items:center;min-height:64px}
.strip .words{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;font-family:var(--font-display);font-size:1.15rem}
.strip .words span{padding:4px 10px;border-radius:10px}
.strip .words .ph{color:var(--muted);font-family:var(--font-body);font-size:.88rem;padding:0}
.strip button{height:40px;padding:0 12px;border-radius:12px;background:var(--sun);font-family:var(--font-display);flex:none;font-size:1rem}
.strip button.ghost{background:var(--paper-2);border:1.5px solid var(--line);font-family:var(--font-body);font-size:.85rem}

/* timer */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1/1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .inner{position:absolute;inset:11%;border-radius:50%;overflow:hidden;background:var(--sun-soft);display:grid;place-items:center;font-family:var(--font-display);font-size:1.8rem;text-align:center;padding:10px;line-height:1.1;word-break:keep-all}
.ring .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ring .inner .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);color:#3E372A;font-size:1.1rem;padding:6px}
.time{font-family:var(--font-display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.time.over{color:var(--coral-deep)}
.timer-next{display:flex;align-items:center;gap:10px;background:var(--paper);padding:10px 14px;border-radius:16px;box-shadow:var(--shadow)}
.timer-next .card{width:56px;font-size:.9rem}

/* choice show mode */
.showing{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.showing .grid{flex:1;align-content:center}
.showing .cell,.showing .slot .card{font-size:1.6rem}
.showing .exit{align-self:flex-end}
.picked{position:fixed;inset:0;z-index:35;background:rgba(60,45,0,.6);display:grid;place-items:center;padding:20px}
.picked .box{background:var(--paper);border-radius:28px;padding:20px;width:min(90vw,380px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.picked .card{width:min(60vw,240px);font-size:2rem}
.picked h2{font-size:2rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(60,45,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--paper);border-radius:24px 24px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{font-size:1.3rem}
.sheet .prog{font-size:.8rem;color:var(--muted)}
.sheet .preview{width:130px;margin:0 auto;font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{flex:1;height:52px;border-radius:14px;font-family:var(--font-display);font-size:1.1rem;background:var(--paper-2);border:1.5px solid var(--line)}
.sheet-actions .primary{background:var(--sun);border-color:transparent;box-shadow:0 4px 0 var(--sun-deep)}
.sheet-actions .ghost{flex:0 0 auto;padding:0 16px;font-family:var(--font-body);font-size:.95rem;color:var(--muted)}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lib-grid .card{font-size:1rem;border:3px solid transparent}
.lib-grid .card.sel{border-color:var(--sun-deep)}
.lib-item{position:relative}
.lib-item .x{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--coral-deep);color:#fff;font-size:.8rem;display:grid;place-items:center;z-index:1}
.lib-item .x.arm{background:#000;width:auto;padding:0 8px;border-radius:14px}
.cat-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-opts button{height:44px;border-radius:12px;font-size:.82rem;border:2.5px solid transparent;color:var(--ink)}
.cat-opts button.on{border-color:var(--ink)}

/* vocab helper */
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.check{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--paper-2);border:2px solid var(--line);font-size:.95rem;cursor:pointer;min-width:0}
.check.on{background:var(--sun-soft);border-color:var(--sun-deep)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--sun-deep);flex:none}
.wordlist{display:flex;flex-wrap:wrap;gap:6px}
.word{height:38px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:1rem;border:2.5px solid transparent;color:var(--ink);opacity:.55}
.word.on{opacity:1;border-color:var(--ink)}
.vgroup h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.vgroup h3 small{font-family:var(--font-body);font-size:.78rem;color:var(--muted)}
.vgroup{display:flex;flex-direction:column;gap:8px}
.sent{background:var(--paper-2);border-radius:12px;padding:8px 12px;font-size:.92rem}
.sent b{font-family:var(--font-display);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-family:var(--font-display);font-size:1.1rem;opacity:0;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,247,220,.7);z-index:45;font-family:var(--font-display);font-size:1.2rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}.top,.strip,.row,.wide-btn,.big-btn,footer,.help-text,.legend{display:none!important}
  .cell{box-shadow:none;border:2px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:90px;page-break-inside:avoid}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" type="button" aria-label="처음으로" hidden>🏠</button>
    <h1 id="title">채움 AAC 도구함<small>채움언어학습연구소</small></h1>
    <div id="topActions" class="row" style="gap:6px;flex-wrap:nowrap"></div>
  </header>
  <main class="view" id="view"></main>
  <footer><b>채움언어학습연구소</b> · 채움 언어치료 스튜디오<br>사진과 보드는 이 기기 안에만 저장되고 어디에도 전송되지 않아요.</footer>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ============ data ============ */
const CATS={people:{label:'사람·대명사',cls:'c-people'},verb:{label:'동사',cls:'c-verb'},desc:{label:'꾸밈말',cls:'c-desc'},noun:{label:'사물·명사',cls:'c-noun'},social:{label:'사회적 말',cls:'c-social'},neg:{label:'거부·부정',cls:'c-neg'},misc:{label:'의문사·기타',cls:'c-misc'}};
const CORE36=[

function speak(text){try{if(!('speechSynthesis' in window)||!text) return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ko'));if(v) u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function busy(on){let b=$('#busy');if(on){if(!b){b=document.createElement('div');b.className='busy';b.id='busy';b.textContent='사진을 정리하고 있어요…';document.body.appendChild(b)}}else if(b) b.remove()}
function readImage(file,maxSide){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const r=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82))}catch(e){rej(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('read'))};img.src=url})}

}
let armT;
function arm(btn,label,fn){
  if(btn.classList.contains('arm')){btn.classList.remove('arm');fn();return}
  document.querySelectorAll('.arm').forEach(b=>{b.classList.remove('arm');if(b.dataset.orig) b.textContent=b.dataset.orig});
  btn.dataset.orig=btn.textContent;btn.classList.add('arm');btn.textContent=label;
  clearTimeout(armT);armT=setTimeout(()=>{if(btn.isConnected){btn.classList.remove('arm');btn.textContent=btn.dataset.orig}},3000);
}

function openSheet(html,onClose){
  closeSheet();
  const s=document.createElement('div');s.className='scrim';s.id='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s){closeSheet();if(onClose) onClose()}});
  document.body.appendChild(s);return s;
}

/* name new library cards one by one */
function nameSheet(queue,i,after){
  if(i>=queue.length){closeSheet();save();if(after) after();return}
  const it=queue[i];
  const s=openSheet(`
    <div class="prog">${queue.length>1?`${i+1} / ${queue.length}`:''}</div>
    <h2>${it.img?'이 사진은 무엇인가요?':'글자 카드에 쓸 말'}</h2>
    <div class="preview" id="pv">${cardHTML(it)}</div>
    ${it.img?'':`<div class="chips" id="colors">${CARD_COLORS.map(c=>`<button class="chip" type="button" data-color="${c}" style="background:${c};width:36px;padding:0;border-color:${c===it.color?'var(--ink)':'transparent'}" aria-label="색"></button>`).join('')}</div>`}
    <div class="field"><label class="label" for="nameIn">카드 이름</label><input id="nameIn" class="display" placeholder="예) 과자" autocomplete="off" value="${esc(it.name||'')}"></div>
    <div class="chips">${SUGGEST.map(w=>`<button class="chip" type="button" data-w="${w}">${w}</button>`).join('')}</div>
    <div class="sheet-actions"><button type="button" class="ghost" id="skipBtn">건너뛰기</button><button type="button" class="primary" id="okBtn">${i<queue.length-1?'다음':'저장'}</button></div>`,()=>{save();if(after) after()});
  const input=s.querySelector('#nameIn');setTimeout(()=>input.focus(),60);
  const refresh=()=>{it.name=input.value;s.querySelector('#pv').innerHTML=cardHTML(it)};
  input.addEventListener('input',refresh);
  s.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{input.value=b.dataset.w;refresh();input.focus()});
  s.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{it.color=b.dataset.color;refresh();s.querySelectorAll('[data-color]').forEach(x=>x.style.borderColor=x.dataset.color===it.color?'var(--ink)':'transparent')});
  const next=()=>{it.name=input.value.trim();nameSheet(queue,i+1,after)};
  s.querySelector('#okBtn').onclick=next;s.querySelector('#skipBtn').onclick=next;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next()}});
}
function addPhotos(after){
  const f=$('#fileInput');f.value='';
  f.onchange=async()=>{
    const files=[...f.files].filter(x=>x.type.startsWith('image/'));if(!files.length) return;
    busy(true);const made=[];
    for(const x of files){try{made.push({id:uid(),name:'',img:await readImage(x,720)})}catch(e){}}
    busy(false);
    if(!made.length){toast('사진을 불러오지 못했어요');return}
    S.lib.push(...made);save();nameSheet(made,0,after);
  };
  f.click();
}

}

let strip=[];

function bindStrip(root){
  root.querySelector('#stripSay').onclick=()=>{if(strip.length){speak(strip.map(w=>w.t).join(' '));toast(strip.map(w=>w.t).join(' '))}};
  root.querySelector('#stripBack').onclick=()=>{strip.pop();rerenderStrip(root)};
}
function rerenderStrip(root){const old=root.querySelector('#strip');if(!old) return;const tmp=document.createElement('div');tmp.innerHTML=stripHTML();old.replaceWith(tmp.firstChild);bindStrip(root)}

 {id:'choice',ic:'🤲',name:'선택판',desc:'2·4·6칸에서 아이가 골라요. 누르면 크게 + 읽어주기'},
 {id:'timer',ic:'⏳',name:'타이머 카드',desc:'활동 카드에 줄어드는 시각 타이머를 붙여요'},
 {id:'core',ic:'🟨🟩🟦',name:'핵심어휘 보드',desc:'Fitzgerald 색 코딩 4·9·16·36칸, 인쇄도 돼요'},
 {id:'scene',ic:'🛒🏥🛝',name:'상황별 미니 보드',desc:'마트·병원·식당·놀이터… 장면마다 한 장'},
 {id:'vocab',ic:'🧭',name:'AAC 어휘 선정 도우미',desc:'일과·목표를 고르면 핵심·부수 어휘를 뽑아줘요'},
];
const VIEWS={};
function route(){
  const h=(location.hash||'#home').slice(1);
  const v=VIEWS[h]||VIEWS.home;
  stopTimer();strip=[];
  const t=TOOLS.find(x=>x.id===h);
  $('#title').firstChild.textContent=h==='library'?'카드함':(t?t.name:'채움 AAC 도구함');

  $('#topActions').innerHTML='';
  const root=$('#view');root.innerHTML='';
  v(root);
  window.scrollTo(0,0);
}
$('#backBtn').onclick=()=>{location.hash='home'};
window.addEventListener('hashchange',route);

    root.innerHTML=`
      <div class="row between"><div class="row"><button class="chip${F.three?'':' on'}" type="button" data-n="2">2칸</button><button class="chip${F.three?' on':''}" type="button" data-n="3">3칸</button></div><button class="chip ghost" type="button" id="ftReset">🔄 처음부터</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
      ${Array.from({length:n}).map((_,i)=>{const c=lib(F.slots[i]);return `${i?'<div class="arrow">⬇</div>':''}
        <div class="slot${c?'':' empty-slot'}${F.done[i]?' is-done':''}${!F.done[i]&&(i===0||F.done[i-1])&&c?' focus':''}" data-i="${i}">

          ${c?`<div class="name">${esc(c.name)}</div><div class="acts"><button type="button" class="pill done" data-done="${i}">${F.done[i]?'↩ 되돌리기':'🎯 끝'}</button><button type="button" class="pill" data-say="${i}">🔊</button></div>`:''}
        </div>`}).join('')}
      </div>
      <p class="help-text">"먼저 ${lib(F.slots[0])?esc(lib(F.slots[0]).name):'___'}, 다음 ${lib(F.slots[1])?esc(lib(F.slots[1]).name):'___'}" — 아이에게 말하면서 카드를 짚어주세요. 끝나면 「끝」을 아이가 직접 누르게 해요.</p>`;
    root.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{F.three=b.dataset.n==='3';save();draw()});
    root.querySelector('#ftReset').onclick=()=>{F.done=[false,false,false];save();draw()};
    root.querySelectorAll('.slot .pick').forEach((b)=>b.onclick=()=>{const i=+b.closest('.slot').dataset.i;pickCard(id=>{F.slots[i]=id;F.done[i]=false;save();draw()},{clearable:true,title:labels[i]+' 카드'})});
    root.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const i=+b.dataset.done;F.done[i]=!F.done[i];save();draw();if(F.done[i]){const nx=lib(F.slots[i+1]);toast(nx?`다음은 ${nx.name}!`:'다 했어요! 🎉');if(nx) speak(`다 했어요. 다음은 ${nx.name}`)}});
    root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const i=+b.dataset.say;const c=lib(F.slots[i]);if(c) speak(`${labels[i]} ${c.name}`)});
  };

};

/* ============ CHOICE BOARD ============ */
VIEWS.choice=function(root){
  const C=S.choice;
  const board=()=>C.boards.find(b=>b.id===C.cur)||C.boards[0];
  const draw=()=>{
    const b=board();C.cur=b.id;
    const cols=b.cols===6?3:2;
    while(b.slots.length<b.cols) b.slots.push(null); b.slots.length=b.cols;
    $('#topActions').innerHTML=`<button class="icon-btn on" type="button" id="showBtn">👧 보여주기</button>`;
    $('#showBtn').onclick=showMode;
    root.innerHTML=`
      <div class="row">${C.boards.map(x=>`<button type="button" class="chip${x.id===b.id?' on':''}" data-board="${x.id}">${esc(x.name)}</button>`).join('')}<button type="button" class="chip ghost" id="newBoard">+ 새 보드</button></div>
      <div class="row between"><div class="row"><span class="label">칸 수</span>${[2,4,6].map(n=>`<button type="button" class="chip${b.cols===n?' on':''}" data-cols="${n}">${n}</button>`).join('')}</div><div class="row"><button type="button" class="chip ghost" id="renBoard">✏️ 이름</button><button type="button" class="chip ghost" id="delBoard" style="color:var(--coral-deep)">삭제</button></div></div>
      <div class="grid cols-${cols}">${b.slots.map((id,i)=>{const c=lib(id);return `<button type="button" class="slot${c?'':' empty-slot'}" data-i="${i}" style="text-align:inherit">${c?cardHTML(c)+`<div class="name">${esc(c.name)}</div>`:'<div class="card">+ 카드</div>'}</button>`}).join('')}</div>
      <p class="help-text">칸을 눌러 카드를 넣고, 위의 「보여주기」로 아이에게 건네세요. 아이가 고른 카드는 크게 뜨고 "OO 할래요"라고 읽어줘요. 처음엔 2칸(좋아하는 것 + 싫어하는 것)으로 시작하면 선택하기를 쉽게 배워요.</p>`;
    root.querySelectorAll('[data-board]').forEach(x=>x.onclick=()=>{C.cur=x.dataset.board;save();draw()});
    root.querySelectorAll('[data-cols]').forEach(x=>x.onclick=()=>{b.cols=+x.dataset.cols;save();draw()});
    root.querySelector('#newBoard').onclick=()=>{const nb={id:uid(),name:'새 보드',cols:4,slots:[null,null,null,null]};C.boards.push(nb);C.cur=nb.id;save();renameBoard(nb)};
    root.querySelector('#renBoard').onclick=()=>renameBoard(b);
    root.querySelector('#delBoard').onclick=e=>arm(e.currentTarget,'정말 삭제?',()=>{if(C.boards.length>1){C.boards=C.boards.filter(x=>x.id!==b.id);C.cur=C.boards[0].id;save();draw()}else toast('보드가 하나뿐이에요')});
    root.querySelectorAll('.slot').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;pickCard(id=>{b.slots[i]=id;save();draw()},{clearable:true,title:`${i+1}번 칸`})});
  };
  const renameBoard=b=>{const s=openSheet(`<h2>보드 이름</h2><div class="field"><input id="bn" class="display" value="${esc(b.name)}" placeholder="예) 간식 고르기"></div><div class="sheet-actions"><button type="button" class="primary" id="okBtn">저장</button></div>`,draw);
    s.querySelector('#okBtn').onclick=()=>{b.name=s.querySelector('#bn').value.trim()||b.name;closeSheet();save();draw()};setTimeout(()=>s.querySelector('#bn').focus(),60)};
  const showMode=()=>{
    const b=board();const cols=b.cols===6?3:2;
    const ov=document.createElement('div');ov.className='showing';
    ov.innerHTML=`<h2 style="font-size:1.5rem;text-align:center">${esc(b.name)} — 뭐 할래요?</h2><div class="grid cols-${cols}">${b.slots.map((id,i)=>{const c=lib(id);return c?`<button type="button" class="slot" data-i="${i}" style="text-align:inherit">${cardHTML(c)}<div class="name">${esc(c.name)}</div></button>`:''}).join('')}</div><button type="button" class="chip exit" id="exitShow">선생님 화면으로</button>`;
    document.body.appendChild(ov);
    speak('뭐 할래요?');
    ov.querySelector('#exitShow').onclick=()=>ov.remove();
    ov.querySelectorAll('.slot').forEach(x=>x.onclick=()=>{const c=lib(b.slots[+x.dataset.i]);if(!c) return;
      const p=document.createElement('div');p.className='picked';
      p.innerHTML=`<div class="box">${cardHTML(c)}<h2>${esc(c.name)} 할래요!</h2><div class="row"><button type="button" class="big-btn mint" id="pkOk">👍 좋아요</button><button type="button" class="chip" id="pkNo">다시 고르기</button></div></div>`;
      document.body.appendChild(p);speak(`${c.name} 할래요`);
      p.querySelector('#pkOk').onclick=()=>{p.remove();toast(`${c.name} 👍`)};p.querySelector('#pkNo').onclick=()=>p.remove();
    });
  };
  draw();
};

/* ============ TIMER CARD ============ */
let tm={run:false,left:0,total:0,iv:null,ac:null};
function stopTimer(){if(tm.iv){clearInterval(tm.iv);tm.iv=null}tm.run=false}
function chime(){try{const ac=tm.ac||(tm.ac=new (window.AudioContext||window.webkitAudioContext)());[0,.18,.36].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=[660,880,1100][i];g.gain.setValueAtTime(.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.5);o.connect(g).connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.55)})}catch(e){}}
VIEWS.timer=function(root){
  const T=S.timer;
  const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
  const draw=()=>{
    const c=lib(T.card),nx=lib(T.next);
    const R=46,CIRC=2*Math.PI*R;
    const frac=tm.total?tm.left/tm.total:1;
    root.innerHTML=`
      <div class="timer-wrap">
        <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="arc" cx="50" cy="50" r="${R}" fill="none" stroke="${tm.left<=0&&tm.total?'var(--coral-deep)':'var(--sun-deep)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg>
          <button type="button" class="inner" id="pickTimerCard" style="padding:0">${c?(c.img?`<img src="${c.img}" alt=""><div class="cap">${esc(c.name)}</div>`:`<span style="color:#3E372A;background:${c.color};position:absolute;inset:0;display:grid;place-items:center;padding:12px">${esc(c.name)}</span>`):'<span style="color:var(--muted);font-family:var(--font-body);font-size:1rem">눌러서<br>활동 카드 고르기</span>'}</button></div>
        <div class="time${tm.total&&tm.left<=0?' over':''}" id="timeTxt">${tm.total?(tm.left<=0?'끝!':fmt(tm.left)):fmt(T.min*60)}</div>
        <div class="row" id="mins">${[1,3,5,10,15,20].map(m=>`<button type="button" class="chip${T.min===m?' on':''}" data-min="${m}">${m}분</button>`).join('')}</div>
        <div class="row"><button type="button" class="big-btn" id="startBtn" style="min-width:160px">${tm.run?'⏸ 잠깐 멈춤':(tm.total&&tm.left>0?'▶ 계속':'▶ 시작')}</button><button type="button" class="chip" id="resetT">↺ 처음으로</button></div>
        <button type="button" class="timer-next" id="pickNext" style="text-align:left">${nx?cardHTML(nx):'<div class="card" style="width:56px;font-size:.8rem;background:var(--paper-2);border:2px dashed var(--line)">+</div>'}<div><div class="label">끝나면 다음은</div><div style="font-family:var(--font-display);font-size:1.15rem">${nx?esc(nx.name):'다음 활동 카드 (선택)'}</div></div></button>
      </div>
      <p class="help-text">노란 띠가 다 사라지면 소리가 나고 "끝!"이 떠요. 시작할 때 "${c?esc(c.name):'OO'} 5분 하고, 끝나면 ${nx?esc(nx.name):'OO'}" 하고 미리 말해주면 전환이 훨씬 수월해요. 화면이 꺼지지 않게 핸드폰 자동 잠금을 길게 해두세요.</p>`;
    root.querySelector('#pickTimerCard').onclick=()=>pickCard(id=>{T.card=id;save();draw()},{title:'지금 할 활동'});
    root.querySelector('#pickNext').onclick=()=>pickCard(id=>{T.next=id;save();draw()},{title:'끝나면 할 활동',clearable:true});
    root.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{T.min=+b.dataset.min;stopTimer();tm.total=0;tm.left=0;save();draw()});
    root.querySelector('#resetT').onclick=()=>{stopTimer();tm.total=0;tm.left=0;draw()};
    root.querySelector('#startBtn').onclick=()=>{
      if(tm.run){stopTimer();draw();return}
      if(!tm.total||tm.left<=0){tm.total=T.min*60;tm.left=tm.total}
      tm.run=true;try{if(tm.ac&&tm.ac.state==='suspended') tm.ac.resume()}catch(e){}
      if(!tm.ac){try{tm.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
      if(c) speak(`${c.name} ${T.min}분 시작`);
      let last=Date.now();
      tm.iv=setInterval(()=>{const now=Date.now();tm.left-=(now-last)/1000;last=now;
        const arc=root.querySelector('#arc'),tt=root.querySelector('#timeTxt');
        if(tm.left<=0){tm.left=0;stopTimer();chime();if(nx) speak(`끝! 다음은 ${nx.name}`);else speak('끝!');draw();return}
        if(arc) arc.setAttribute('stroke-dashoffset',CIRC*(1-tm.left/tm.total));if(tt) tt.textContent=fmt(tm.left);
      },1000);
      draw();
    };
  };
  draw();
};

/* ============ CORE BOARD MAKER ============ */
VIEWS.core=function(root){
  const K=S.core;let editing=false;
  const colsOf=n=>({4:2,9:3,16:4,36:6})[n]||4;
  const draw=()=>{
    while(K.cells.length<K.size) K.cells.push(null); if(K.cells.length>K.size) K.cells.length=K.size;
    $('#topActions').innerHTML=`<button class="icon-btn${editing?' on':''}" type="button" id="editBtn">${editing?'✅ 편집 끝':'✏️ 편집'}</button>`;
    $('#editBtn').onclick=()=>{editing=!editing;draw()};
    root.innerHTML=`
      ${stripHTML()}
      ${editing?`<div class="row between"><div class="row"><span class="label">칸 수</span>${[4,9,16,36].map(n=>`<button type="button" class="chip${K.size===n?' on':''}" data-size="${n}">${n}</button>`).join('')}</div><button type="button" class="chip ghost" id="fillCore">기본 핵심어로 채우기</button></div>`:''}
      <div class="grid cols-${colsOf(K.size)}" id="coreGrid">${K.cells.map(c=>cellHTML(c,editing)).join('')}</div>
      ${legendHTML()}
      <p class="help-text">${editing?'칸을 눌러 단어·색·그림을 바꿔요. 색은 품사별 Fitzgerald 코딩이라 보드가 바뀌어도 아이가 위치와 색으로 단어를 찾을 수 있어요.':'칸을 누르면 읽어주고 위의 띠에 모여요. 「▶ 말하기」로 문장을 들려주세요. 인쇄는 브라우저 메뉴의 인쇄로 — 색이 그대로 나와요.'}</p>`;
    bindStrip(root);
    root.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{K.size=+b.dataset.size;save();draw()});
    const fc=root.querySelector('#fillCore');if(fc) fc.onclick=()=>{K.cells=CORE36.slice(0,K.size).map(([t,c,s])=>({t,c,s}));save();draw();toast('기본 핵심어휘로 채웠어요')};
    root.querySelectorAll('#coreGrid .cell').forEach((b,i)=>b.onclick=()=>{
      if(editing) editCell(K.cells[i],c=>{K.cells[i]=c;save();draw()},{deletable:true});
      else if(K.cells[i]&&K.cells[i].t) tapWord(root,K.cells[i]);
    });
  };
  draw();
};

/* ============ SCENE BOARDS ============ */

    $('#topActions').innerHTML=`<button class="icon-btn${editing?' on':''}" type="button" id="editBtn">${editing?'✅ 편집 끝':'✏️ 편집'}</button>`;
    $('#editBtn').onclick=()=>{editing=!editing;draw()};
    root.innerHTML=`
      <div class="row" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none">${Z.list.map(s=>`<button type="button" class="chip${s.id===sc.id?' on':''}" data-scene="${s.id}">${s.emoji} ${esc(s.name)}</button>`).join('')}<button type="button" class="chip ghost" id="newScene">+ 장면</button></div>
      ${stripHTML()}
      ${editing?`<div class="row between"><div class="row"><button type="button" class="chip" id="renScene">✏️ 장면 이름</button><button type="button" class="chip" id="addCell">+ 칸 추가</button></div><button type="button" class="chip ghost" id="delScene" style="color:var(--coral-deep)">장면 삭제</button></div>`:''}
      <div class="grid cols-3" id="sceneGrid">${sc.cells.map(c=>cellHTML(c,editing)).join('')}</div>
      ${legendHTML()}
      <p class="help-text">${editing?'칸을 눌러 바꾸거나, 「카드함 사진 쓰기」로 우리 동네 마트·우리 병원 사진을 넣으면 훨씬 잘 알아봐요.':'외출 전에 이 장면을 열어 한 번 같이 짚어보고, 현장에서는 아이가 누르게 해주세요. 왼쪽 위부터 자주 쓰는 말을 두면 좋아요.'}</p>`;
    bindStrip(root);
    root.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{Z.cur=b.dataset.scene;strip=[];save();draw()});
    root.querySelector('#newScene').onclick=()=>{const ns={id:uid(),name:'새 장면',emoji:'📍',cells:[{t:'도와줘',c:'social'},{t:'더',c:'desc'},{t:'싫어',c:'neg'},{t:'끝',c:'misc'}]};Z.list.push(ns);Z.cur=ns.id;save();editing=true;renScene(ns)};
    const rs=root.querySelector('#renScene');if(rs) rs.onclick=()=>renScene(sc);
    const ac=root.querySelector('#addCell');if(ac) ac.onclick=()=>editCell(null,c=>{if(c){sc.cells.push(c);save()}draw()});
    const ds=root.querySelector('#delScene');if(ds) ds.onclick=e=>arm(e.currentTarget,'정말 삭제?',()=>{if(Z.list.length>1){Z.list=Z.list.filter(s=>s.id!==sc.id);Z.cur=Z.list[0].id;save();draw()}else toast('장면이 하나뿐이에요')});
    root.querySelectorAll('#sceneGrid .cell').forEach((b,i)=>b.onclick=()=>{
      if(editing) editCell(sc.cells[i],c=>{if(c) sc.cells[i]=c;else sc.cells.splice(i,1);save();draw()},{deletable:true});
      else if(sc.cells[i]&&sc.cells[i].t) tapWord(root,sc.cells[i]);
    });
  };
  const renScene=sc=>{const s=openSheet(`<h2>장면 이름</h2><div class="row"><div class="field" style="width:80px"><label class="label" for="se">이모지</label><input id="se" value="${esc(sc.emoji)}" style="font-size:1.5rem;text-align:center"></div><div class="field" style="flex:1"><label class="label" for="sn">이름</label><input id="sn" class="display" value="${esc(sc.name)}"></div></div><div class="sheet-actions"><button type="button" class="primary" id="okBtn">저장</button></div>`,draw);
    s.querySelector('#okBtn').onclick=()=>{sc.name=s.querySelector('#sn').value.trim()||sc.name;sc.emoji=s.querySelector('#se').value.trim()||sc.emoji;closeSheet();save();draw()};setTimeout(()=>s.querySelector('#sn').focus(),60)};
  draw();
};

/* ============ VOCAB HELPER ============ */
VIEWS.vocab=function(root){
  const V=S.vocab;
  const compute=()=>{
    const fringe={};V.routines.forEach(r=>{(ROUTINES[r]||[]).forEach(w=>{if(!CORE_ALWAYS.includes(w)){fringe[w]=fringe[w]||[];fringe[w].push(r)}})});
    const fn={};V.goals.forEach(g=>{(GOALS[g]||[]).forEach(w=>{fn[w]=fn[w]||[];fn[w].push(g)})});
    const likes=V.likes.split(/[,，\n]/).map(s=>s.trim()).filter(Boolean);
    return {fringe,fn,likes};
  };
  const draw=()=>{
    const {fringe,fn,likes}=compute();
    if(!V.picked){V.picked=[...CORE_ALWAYS,...Object.keys(fn),...Object.keys(fringe).slice(0,12),...likes]}
    const pickedSet=new Set(V.picked);
    const wordBtn=(w,note)=>`<button type="button" class="word ${CATS[catOf(w)].cls}${pickedSet.has(w)?' on':''}" data-w="${esc(w)}" title="${esc(note||'')}">${esc(w)}</button>`;
    root.innerHTML=`
      <div class="panel">
        <h3>1. 아이의 하루에 이런 장면이 있나요?</h3>
        <div class="check-grid">${Object.keys(ROUTINES).map(r=>`<label class="check${V.routines.includes(r)?' on':''}"><input type="checkbox" data-r="${r}" ${V.routines.includes(r)?'checked':''}>${r}</label>`).join('')}</div>
      </div>
      <div class="panel">
        <h3>2. 먼저 가르치고 싶은 의사소통 기능은?</h3>
        <div class="check-grid">${Object.keys(GOALS).map(g=>`<label class="check${V.goals.includes(g)?' on':''}"><input type="checkbox" data-g="${g}" ${V.goals.includes(g)?'checked':''}>${g}</label>`).join('')}</div>
        <div class="field"><label class="label" for="likes">3. 아이가 아주 좋아하는 것 (쉼표로 구분)</label><input id="likes" value="${esc(V.likes)}" placeholder="예) 뽀로로, 젤리, 비눗방울"></div>
      </div>
      <div class="panel">
        <div class="row between"><h3>추천 어휘 <small class="label">${V.picked.length}개 선택</small></h3><button type="button" class="chip ghost" id="recalc">↺ 추천 다시 받기</button></div>
        <div class="vgroup"><h3>핵심어휘 <small>어디서나 쓰는 말 · 보드에 항상</small></h3><div class="wordlist">${CORE_ALWAYS.map(w=>wordBtn(w)).join('')}</div></div>
        ${V.goals.length?`<div class="vgroup"><h3>기능어휘 <small>고른 목표(${V.goals.join(', ')})에 바로 쓰는 말</small></h3><div class="wordlist">${Object.keys(fn).map(w=>wordBtn(w,fn[w].join(', '))).join('')}</div></div>`:''}
        ${Object.keys(fringe).length?`<div class="vgroup"><h3>부수어휘 <small>고른 장면에서 나오는 말</small></h3><div class="wordlist">${Object.keys(fringe).map(w=>wordBtn(w,fringe[w].join(', '))).join('')}</div></div>`:''}
        ${likes.length?`<div class="vgroup"><h3>동기 어휘 <small>아이가 좋아하는 것 · 첫 요구하기에 최고</small></h3><div class="wordlist">${likes.map(w=>wordBtn(w)).join('')}</div></div>`:''}
        ${legendHTML()}
      </div>
      <div class="panel">
        <h3>이렇게 모델링해 보세요</h3>
        ${V.goals.map(g=>({'요구하기':`<b>${likes[0]||'과자'} 주세요</b> — 아이가 손을 뻗을 때 어른이 먼저 카드를 짚으며 말해요.`,'거부하기':`<b>싫어 / 그만</b> — 밀쳐내거나 울기 전에 카드를 짚어주면 문제행동 대신 말로 거부하는 걸 배워요.`,'관심 끌기·사회적':`<b>봐! / 같이</b> — 아이가 뭔가 보여주고 싶어 할 때 짚어주세요.`,'질문하기':`<b>어디? / 뭐야?</b> — 숨기기 놀이에서 어른이 먼저 묻는 모델을 많이 보여줘요.`,'감정 말하기':`<b>화나 / 무서워</b> — 아이가 그 감정일 때 즉시, 어른의 감정도 카드로 말해요.`,'정보 말하기':`<b>다 했어 / 없어</b> — 활동 끝, 간식 그릇이 비었을 때 짚어주세요.`}[g]||'')).map(s=>`<div class="sent">${s}</div>`).join('')}
        <p class="help-text" style="margin-top:4px">하루에 아이가 말하는 횟수보다 어른이 보드로 <b>보여주는</b> 횟수가 훨씬 많아야 해요. 목표: 하루 10번 이상 모델링.</p>
      </div>
      <div class="row"><button type="button" class="big-btn" style="flex:1" id="toCore">🟨 선택한 단어로 핵심어휘 보드 만들기</button></div>
      <div class="row"><button type="button" class="wide-btn" style="flex:1" id="copyList">📋 단어 목록 복사</button></div>`;
    root.querySelectorAll('[data-r]').forEach(c=>c.onchange=()=>{V.routines=c.checked?[...V.routines,c.dataset.r]:V.routines.filter(x=>x!==c.dataset.r);V.picked=null;save();draw()});
    root.querySelectorAll('[data-g]').forEach(c=>c.onchange=()=>{V.goals=c.checked?[...V.goals,c.dataset.g]:V.goals.filter(x=>x!==c.dataset.g);V.picked=null;save();draw()});
    const li=root.querySelector('#likes');li.onchange=()=>{V.likes=li.value;V.picked=null;save();draw()};
    root.querySelector('#recalc').onclick=()=>{V.picked=null;save();draw()};
    root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;V.picked=pickedSet.has(w)?V.picked.filter(x=>x!==w):[...V.picked,w];save();draw()});
    root.querySelector('#toCore').onclick=()=>{
      const words=[...new Set(V.picked)];
      const size=words.length<=4?4:words.length<=9?9:words.length<=16?16:36;
      S.core.size=size;S.core.cells=words.slice(0,36).map(w=>{const k=CORE36.find(x=>x[0]===w);return {t:w,c:catOf(w),s:k?k[2]:''}});
      while(S.core.cells.length<size) S.core.cells.push(null);
      save();toast(`${Math.min(words.length,36)}개 단어로 ${size}칸 보드를 만들었어요`);location.hash='core';
    };
    root.querySelector('#copyList').onclick=async e=>{
      const txt=`[핵심어휘] ${CORE_ALWAYS.filter(w=>pickedSet.has(w)).join(', ')}\n[기능어휘] ${Object.keys(fn).filter(w=>pickedSet.has(w)).join(', ')}\n[부수어휘] ${Object.keys(fringe).filter(w=>pickedSet.has(w)).join(', ')}\n[동기어휘] ${likes.filter(w=>pickedSet.has(w)).join(', ')}`;
      try{await navigator.clipboard.writeText(txt);toast('복사했어요')}catch(err){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(_){toast('복사가 막혀 있어요')}ta.remove()}
    };
  };
  draw();
};

/* ============ boot ============ */
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet()});
load().then(()=>{try{speechSynthesis.getVoices()}catch(e){}route()});
})();
</script>
